<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cohort</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with sprint clock + tabs; each view is a filter bar over a board, grid or list. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e4eae7; --ink:#16201b; --muted:#5a6862; --line:#d3dcd8;
  --accent:#1d6b58; --accent-ink:#ffffff; --accent-soft:#d6ebe4;
  --s-todo:#66727c; --s-prog:#2c66d1; --s-test:#a8700f; --s-done:#2b8a4b;
  --s-todo-bg:#e7ebee; --s-prog-bg:#dfe8fa; --s-test-bg:#f6ead2; --s-done-bg:#dcefe2;
  --danger:#b3342b; --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --s-over:#c0302a; --s-over-bg:#fbe3e1; --s-near:#c2620c; --s-near-bg:#fdebd9;
  --code-bg:#f6f8f7; --c-kw:#8a2f9c; --c-str:#1f7a3a; --c-num:#b0560f; --c-com:#7a8781; --c-fn:#2153b8; --c-attr:#9a5b00;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201d; --sunk:#141a17; --ink:#e4ebe7; --muted:#97a69f; --line:#2a3430;
  --accent:#5cc3a6; --accent-ink:#0d1714; --accent-soft:#1d3a32;
  --s-todo:#9aa6b0; --s-prog:#7ea6f2; --s-test:#e0aa4c; --s-done:#6cc98c;
  --s-todo-bg:#232a2f; --s-prog-bg:#1d2a44; --s-test-bg:#3a2f18; --s-done-bg:#1c3324;
  --danger:#f07b70; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --s-over:#f27c72; --s-over-bg:#3d1e1c; --s-near:#f3a35c; --s-near-bg:#3b2814;
  --code-bg:#151b18; --c-kw:#d39bf0; --c-str:#8fd19e; --c-num:#f2a86b; --c-com:#76857e; --c-fn:#8db4ff; --c-attr:#e6c07b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201d; --sunk:#141a17; --ink:#e4ebe7; --muted:#97a69f; --line:#2a3430;
  --accent:#5cc3a6; --accent-ink:#0d1714; --accent-soft:#1d3a32;
  --s-todo:#9aa6b0; --s-prog:#7ea6f2; --s-test:#e0aa4c; --s-done:#6cc98c;
  --s-todo-bg:#232a2f; --s-prog-bg:#1d2a44; --s-test-bg:#3a2f18; --s-done-bg:#1c3324;
  --danger:#f07b70; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  --s-over:#f27c72; --s-over-bg:#3d1e1c; --s-near:#f3a35c; --s-near-bg:#3b2814;
  --code-bg:#151b18; --c-kw:#d39bf0; --c-str:#8fd19e; --c-num:#f2a86b; --c-com:#76857e; --c-fn:#8db4ff; --c-attr:#e6c07b; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.signin{max-width:560px;margin:24px auto}
.signin h2{font-family:var(--f-display);margin:0;font-size:22px}
.signin p{margin:0}
.signin form{padding:0}
.signin code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.err{color:var(--danger);font-size:13px}
.repo a{color:var(--muted)}
.signin .note{font-family:var(--f-body);font-size:13px;line-height:1.5}
.signin a{color:var(--accent)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px 0}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0}
.clock{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.clock b{color:var(--ink);font-weight:500}
.clock a{color:var(--accent)}
.clock .bar{width:84px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle}
.clock .bar i{display:block;height:100%;background:var(--accent)}
.spacer{flex:1}
nav.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a .n{font-family:var(--f-mono);font-size:11px;margin-left:6px;color:var(--muted)}

main{padding-block:20px 60px}
.viewhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.viewhead h2{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0;letter-spacing:-.015em;text-wrap:balance}
.viewhead p{margin:2px 0 0;color:var(--muted)}
.viewhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.subhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.subhead h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.subhead p{margin:0;color:var(--muted);font-size:13px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.fld select,.fld input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
.fld .hint{font-size:13px;color:var(--muted);padding:6px 0}
.fld .hint a{color:var(--accent)}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg .n{font-family:var(--f-mono);font-size:11px;margin-left:4px}
.note{font-size:12px;color:var(--muted);font-family:var(--f-mono)}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,.7fr);gap:12px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--sunk);border-radius:10px;padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px;border:1px dashed transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.colhead{display:flex;align-items:center;gap:8px;padding:4px 4px 2px;font-weight:600}
.colhead .cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:grab;box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card.is-near{border-color:var(--s-near);background:linear-gradient(var(--s-near-bg),var(--s-near-bg)) top/100% 4px no-repeat,var(--surface);box-shadow:inset 3px 0 0 var(--s-near),var(--shadow)}
.card.is-over{border-color:var(--s-over);background:linear-gradient(var(--s-over-bg),var(--s-over-bg)) top/100% 4px no-repeat,var(--surface);box-shadow:inset 3px 0 0 var(--s-over),var(--shadow)}
.timing{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.timing .tbar{flex:1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;min-width:40px}
.timing .tbar i{display:block;height:100%}
.col.overcol{background:var(--s-over-bg)}
.st-overdue{background:var(--s-over-bg);color:var(--s-over)} .st-near{background:var(--s-near-bg);color:var(--s-near)}
.due-over{color:var(--s-over);font-weight:600} .due-near{color:var(--s-near);font-weight:600}
.card h4{margin:0;font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;cursor:pointer}
.card h4:hover{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.meta .mono{font-family:var(--f-mono)}
.card .foot{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card select,.rowsel{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 6px;font-size:12px;max-width:100%}
.donezone{align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:6px}
.donezone .big{font-family:var(--f-display);font-size:34px;font-weight:700;color:var(--s-done);line-height:1}
.empty-col{color:var(--muted);font-size:13px;padding:10px 4px}

.av{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:600;color:#fff;flex:none;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.av.lg{width:42px;height:42px;font-size:15px}
.av.off{filter:grayscale(1);opacity:.6}
.who{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.st-todo,.sp-planned,.ms-inactive{background:var(--s-todo-bg);color:var(--s-todo)} .st-in-progress,.sp-active{background:var(--s-prog-bg);color:var(--s-prog)}
.st-on-test{background:var(--s-test-bg);color:var(--s-test)} .st-done,.sp-completed,.ms-active{background:var(--s-done-bg);color:var(--s-done)}
.pr{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
.pr-urgent{color:var(--danger);border-color:var(--danger)} .pr-high{color:var(--s-test);border-color:var(--s-test)}
.tag{font-size:11px;background:var(--sunk);padding:1px 6px;border-radius:4px;color:var(--muted)}

/* grids of cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box.is-active{border-color:var(--s-prog);box-shadow:inset 0 0 0 1px var(--s-prog)}
.box .id{display:flex;gap:12px;align-items:center;min-width:0}
.box .id div{min-width:0}
.box h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.box .role{color:var(--muted);font-size:13px}
.box .goal{margin:0;font-size:13px;overflow-wrap:anywhere}
.box .goal.none{color:var(--muted);font-style:italic}
.stack{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.stack i{display:block}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.counts b{display:block;font-family:var(--f-mono);font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.counts span{font-size:11px;color:var(--muted)}
.box .acts{display:flex;gap:6px;flex-wrap:wrap}
.toprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.levels{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:500}
.chip .x{border:0;background:transparent;color:var(--muted);cursor:pointer;width:20px;height:20px;border-radius:50%;line-height:1;font-size:15px}
.chip .x:hover{background:var(--line);color:var(--danger)}
.addlevel{display:flex;gap:6px}
.addlevel input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px}
.btn.ghost.danger{color:var(--danger)}
/* lists */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
td .t{font-weight:600;cursor:pointer;overflow-wrap:anywhere} td .t:hover{color:var(--accent)}
td .sub{font-size:12px;color:var(--muted);margin-top:2px;max-width:46ch}
td .rowacts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}

.meetings{display:flex;flex-direction:column;gap:10px}
.mtg{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:grid;grid-template-columns:86px minmax(0,1fr);overflow:hidden}
.mtg .date{background:var(--sunk);padding:12px 8px;text-align:center;font-family:var(--f-mono);display:flex;flex-direction:column;justify-content:center;gap:2px}
.mtg .date b{font-family:var(--f-display);font-size:26px;line-height:1;font-weight:700}
.mtg .date span{font-size:11px;color:var(--muted);text-transform:uppercase}
.mtg .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mtg .row1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mtg h3{margin:0;font-size:15px;cursor:pointer;overflow-wrap:anywhere}
.mtg h3:hover{color:var(--accent)}
.mtg pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);font-size:13px;color:var(--ink);max-height:7.5em;overflow:hidden}
.mtg.open pre{max-height:none}
.mtg .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.typ{font-size:11px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.avs{display:flex}
.avs .av{margin-left:-5px;border:2px solid var(--surface)} .avs .av:first-child{margin-left:0}

.emptystate{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.emptystate h3{font-family:var(--f-display);margin:0;font-size:19px}
.emptystate p{margin:0;color:var(--muted);max-width:52ch}
.emptystate .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.banner{border:1px solid var(--s-test);background:var(--s-test-bg);color:var(--ink);padding:9px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}

/* docs */
.docs{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.docs{grid-template-columns:minmax(0,1fr)}.docs.has-sel .doclist{display:none}.docs:not(.has-sel) .docpane{display:none}}
@media (min-width:861px){.backlink{display:none!important}}
.doclist{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);max-height:calc(100vh - 120px)}
.doclist .dl-f{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.doclist .dl-f .row{display:flex;gap:6px}
.doclist .dl-f .row select{flex:1;min-width:0}
.doclist input,.doclist select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;width:100%}
.dl-items{overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:2px}
.dl-item{display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;width:100%}
.dl-item:hover{background:var(--sunk)}
.dl-item[aria-current="true"]{background:var(--accent-soft)}
.dl-item b{font-weight:600;overflow-wrap:anywhere}
.dl-item .meta{gap:4px}
.kind{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
.cat{font-size:11px;font-weight:600;color:var(--accent)}
.docpane{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px clamp(16px,3vw,36px) 32px}
.docpane .dp-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
.docpane .dp-head h2{font-family:var(--f-display);font-size:30px;margin:0;letter-spacing:-.015em;text-wrap:balance;overflow-wrap:anywhere}
.docpane .dp-head .meta{margin-top:6px}
/* rendered markdown */
.md{max-width:78ch;font-size:15px;line-height:1.65;overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4{font-family:var(--f-display);line-height:1.25;margin:1.6em 0 .5em;text-wrap:balance}
.md h1{font-size:26px}.md h2{font-size:22px}.md h3{font-size:18px}.md h4{font-size:16px}
.md p,.md ul,.md ol,.md blockquote,.md table{margin:0 0 1em}
.md a{color:var(--accent)}
.md img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);display:block;margin:.4em 0}
.md video{width:100%;max-height:70vh;border-radius:8px;background:#000;display:block;margin:.4em 0}
.md blockquote{border-left:3px solid var(--accent);padding:2px 14px;color:var(--muted);background:var(--sunk);border-radius:0 6px 6px 0}
.md code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.md hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.md li input[type=checkbox]{margin-right:6px}
.md ul:has(input[type=checkbox]){list-style:none;padding-left:4px}
.md .tbl{overflow-x:auto;margin:0 0 1em}
.md table{border-collapse:collapse;min-width:0;width:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-transform:none;letter-spacing:0;font-size:14px}
.md th{background:var(--sunk);color:var(--ink);font-weight:600}
.codeblk{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 1em;background:var(--code-bg)}

.pill.sev-high{background:var(--s-over-bg);color:var(--s-over)}.pill.sev-warn{background:var(--s-near-bg);color:var(--s-near)}
.pill.sev-info{background:var(--s-prog-bg);color:var(--s-prog)}.pill.sev-good{background:var(--s-done-bg);color:var(--s-done)}

.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.fgroup{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fhead{display:flex;gap:8px;align-items:center}
.finding{font-size:13px;border-top:1px solid var(--line);padding-top:8px;overflow-wrap:anywhere}
table.wl td.stick{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}.rvbtn{margin-top:8px;display:block}table.wl .flags{min-width:200px}table.wl{min-width:640px}table.wl td{vertical-align:top}table.wl td:first-child{min-width:190px}table.wl .rowacts{flex-wrap:nowrap}
.flags{display:flex;flex-wrap:wrap;gap:4px}
.leavein{width:76px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px}

tr.off{opacity:.55}
details.ref{margin-top:16px}details.ref summary{cursor:pointer;font-weight:600;margin-bottom:8px}
.params{gap:16px}.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.params label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.params input,.params select,.params textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 8px;font-size:14px;font-weight:400;color:var(--ink);max-width:100%}
.params textarea{min-height:60px;resize:vertical}
.params .note{font-weight:400}
.params fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.params legend{font-weight:600;font-size:13px;padding:0 4px}
.params .checks label{flex-direction:row}
.tag.ins{border:1px solid var(--line);cursor:pointer;font-family:var(--f-mono)}.tag.ins:hover{border-color:var(--accent);color:var(--ink)}
.est{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
/* reviews */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.kv div{background:var(--sunk);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

.tlist{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink);font-weight:400;display:flex;flex-direction:column;gap:3px;max-height:180px;overflow:auto}
.db .sec-h{font-size:12px;color:var(--muted)}
/* delete challenge */
#cdlg{width:min(440px,calc(100vw - 32px))}
.cf .cf-sub{margin:0;padding:0 18px;color:var(--muted)}
.cf-body{padding:16px 18px 4px;display:flex;flex-direction:column;align-items:center;gap:12px}

.ty-word{display:flex;gap:6px}
.ty-word span{width:40px;height:48px;display:grid;place-items:center;border-radius:8px;border:2px solid var(--line);background:var(--bg);font:700 22px var(--f-mono);text-transform:uppercase;color:var(--muted);transition:background .12s,border-color .12s,color .12s,transform .12s}
.ty-word span.hit{background:var(--danger,#c0392b);border-color:var(--danger,#c0392b);color:#fff;transform:translateY(-2px)}
.ty-word span.cur{border-color:var(--ink)}
.ty-word.shake{animation:tyshake .28s}
@keyframes tyshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.25)}

.db{padding:8px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-y:auto}
.db .full{grid-column:1/-1}
@media (max-width:480px){.db{grid-template-columns:1fr}}

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const STATUSES=[["todo","To do","var(--s-todo)"],["in-progress","In progress","var(--s-prog)"],["on-test","On test","var(--s-test)"],["done","Done","var(--s-done)"]];
const SLABEL=Object.fromEntries(STATUSES.map(s=>[s[0],s[1]]));
const SPLABEL={planned:"Planned",active:"Active",completed:"Completed"};
const PRIOS=[["low","Low"],["medium","Medium"],["high","High"],["urgent","Urgent"]];
const PRANK={urgent:0,high:1,medium:2,low:3};
const MTYPES=[["daily","Daily standup"],["product","Weekly product call"],["sprint-plan","Sprint planning"],["quarter-plan","Quarter planning"]];
const MLABEL=Object.fromEntries(MTYPES);
const COLORS=["#1d6b58","#2c66d1","#8a4fc4","#c2456b","#c56a1c","#5d7a14","#127a8a","#6b5b4e"];
/* Extra preset colors shown in every color picker, alongside the defaults above. */
const EXTRA_COLORS=["#000000","#ffffff","#6b7280","#1e3a8a","#0ea5e9","#16a34a","#eab308","#f97316","#dc2626","#db2777","#7c3aed","#92400e"];
const normColor=c=>{c=String(c||"").trim().toLowerCase();if(/^#[0-9a-f]{3}$/.test(c))c="#"+c.slice(1).split("").map(x=>x+x).join("");return/^#[0-9a-f]{6}$/.test(c)?c:""};
/* Dark or light text, whichever reads better on the given background. */
function textOn(bg){const c=normColor(bg);if(!c)return"#fff";const[r,g,b]=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);
  const L=.2126*r+.7152*g+.0722*b;return L>.35?"#111":"#fff"}
const TEMPLATES={

  const vars={o:GH.owner,n:GH.repo,ref:"refs/heads/"+GH.branch};COLLS.forEach(c=>vars[c]=GH.branch+":data/"+c);
  const j=await gh(GH.api.replace(/\/$/,"")+"/graphql",{method:"POST",body:{query:q,variables:vars}});
  if(j&&j.errors&&!(j.data&&j.data.repository)){const e=new Error(j.errors[0].message);e.status=404;throw e}
  const repo=j.data.repository;
  if(!repo.ref){const e=new Error(`Branch "${GH.branch}" wasn't found in ${GH.owner}/${GH.repo}.`);e.status=404;throw e}
  GH.head=repo.ref.target.oid;
  for(const c of COLLS){

let wq=Promise.resolve();

async function getRecord(c,id){

}

      else{const f=await getRecord(c,id);base=f&&f.data;sha=f&&f.sha}
      const data=make(base);if(!data){const e=new Error("That record no longer exists.");e.status=404;throw e}

  return`<div class="signin box">

      <label>Owner<input id="gh-owner" required value="${esc(saved.owner||"")}" placeholder="your-org"></label>
      <label>Repository<input id="gh-repo" required value="${esc(saved.repo||"")}" placeholder="cohort"></label>
      <label>Branch<input id="gh-branch" required value="${esc(saved.branch||"main")}"></label>
      <label class="full">Personal access token<input id="gh-token" type="password" required placeholder="github_pat_…"></label>
      <p class="note full">Use a fine-grained token limited to this repository with <b>Contents: Read and write</b>. Read-only teammates can use <b>Contents: Read-only</b>. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a token on GitHub</a>. It is stored only in this browser.</p>

document.addEventListener("submit",e=>{
  if(e.target.id!=="gh-form")return;e.preventDefault();
  const v=id=>document.getElementById(id).value;
  const saved=Object.assign(ghDefaults(),LS.get(CFG_KEY)||{});
  connect({api:saved.api,owner:v("gh-owner"),repo:v("gh-repo"),branch:v("gh-branch"),token:v("gh-token")});
});
setInterval(poll,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});

/* ---------- header ---------- */
function renderClock(){
  const s=currentSprint();let h="";
  if(s){const len=sprintLen(s);const day=Math.min(len,Math.max(0,Math.round((utc(today())-utc(s.startDate))/864e5)+1));
    h=`<b>${esc(s.name)}</b> ${fmt(s.startDate)} – ${fmt(s.endDate)} `+(day>0?`<span class="bar" title="Day ${day} of ${len}"><i style="width:${day/len*100}%"></i></span> day ${day}/${len}`:`<span>starts ${fmt(s.startDate)}</span>`)+(s.status!=="active"?` <span>(${SPLABEL[s.status]||"planned"})</span>`:"");}
  else h=`<span>No sprint yet</span> <a href="#sprints">Plan one</a>`;
  $("#clock").innerHTML=h+` · <b>${qLabel(curQuarter())}</b>`;
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===S.view?"page":"false"));
  const active=S.tasks.filter(t=>t.status!=="done"&&t.sprintId).length;
  $("#n-tasks").textContent=active||"";$("#n-sprints").textContent=openSprints().length||"";
  $("#n-team").textContent=activeMembers().length||"";$("#n-meetings").textContent=S.meetings.length||"";$("#n-epics").textContent=openEpics().length||"";$("#n-docs").textContent=S.docs.length||"";
  const arch=S.tasks.filter(t=>t.status==="done").length+doneSprints().length+inactiveMembers().length;
  $("#n-archive").textContent=arch||"";
  $("#tabs").hidden=!S.db;$("#btnOut").hidden=!S.db;$("#clock").hidden=!S.db;
  $("#repo").innerHTML=S.db?`<a href="https://github.com/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/commits/${encodeURIComponent(GH.branch)}" target="_blank" rel="noopener">${esc(GH.owner)}/${esc(GH.repo)}</a>${S.readOnly?" · read-only":""}`:"";
}

/* ---------- option builders ---------- */
const sprintOpt=(s,sel)=>`<option value="${esc(s.id)}"${sel===s.id?" selected":""}>${esc(s.name)} · ${fmt(s.startDate)} – ${fmt(s.endDate)}${s.status==="active"?" (active)":s.status==="completed"?" (completed)":""}</option>`;
function quarterOptions(sel,includeAll){
  const set=new Set([curQuarter()]);const y=+today().slice(0,4);
  for(let yy=y-1;yy<=y+1;yy++)for(let q=1;q<=4;q++)set.add(yy+"-Q"+q);
  S.tasks.forEach(t=>set.add(taskQuarter(t)));
  const list=[...set].sort().reverse();
  return(includeAll?`<option value="all"${sel==="all"?" selected":""}>All quarters</option>`:"")+
    list.map(q=>`<option value="${q}"${sel===q?" selected":""}>${qLabel(q)}${q===curQuarter()?" (current)":""}</option>`).join("");
}
const mOpts=(list,sel)=>list.map(m=>`<option value="${esc(m.id)}"${sel===m.id?" selected":""}>${esc(m.name)}${isActive(m)?"":" (inactive)"}</option>`).join("");
const prioOptions=(sel,all)=>(all?`<option value="all"${sel==="all"?" selected":""}>All priorities</option>`:"")+PRIOS.map(([v,l])=>`<option value="${v}"${sel===v?" selected":""}>${l}</option>`).join("");

/* ---------- banners ---------- */
function banners(){
  let h="";
  if(S.offline)h+=`<div class="banner">Can't reach GitHub right now. Your team's latest changes will load when the connection is back.</div>`;
  if(S.readOnly)h+=`<div class="banner">Your token can read this repository but not write to it, so changes won't be saved. Use a token with Contents: Read and write.</div>`;
  return h;
}
const loading=()=>!!S.db&&!Object.values(S.loaded).every(Boolean);

/* ---------- TASKS view ---------- */
function filteredActive(){
  const f=S.f.tasks;
  return S.tasks.filter(t=>{
    if(f.member!=="all"&&(f.member==="none"?t.assigneeId:t.assigneeId!==f.member))return false;
    if(f.prio!=="all"&&(t.priority||"medium")!==f.prio)return false;
    if(!matchRL(memberById(t.assigneeId),f.role,f.level))return false;
    if(f.epic!=="all"&&(f.epic==="none"?!!t.epicId:t.epicId!==f.epic))return false;
    if(f.timing!=="all"&&taskTiming(t).state!==f.timing)return false;
    if(f.q&&!(taskKey(t)+" "+t.title+" "+(t.description||"")+" "+tagsOf(t).join(" ")).toLowerCase().includes(f.q.toLowerCase()))return false;
    if(f.mode==="sprint")return!!f.sprint&&t.sprintId===f.sprint;
    if(!t.sprintId)return false; // backlog items live on the Sprints & backlog tab
    if(f.mode==="quarter")return taskQuarter(t)===f.quarter;
    if(f.mode==="week"){const ds=[isoDay(t.createdAt),isoDay(t.updatedAt),t.dueDate,isoDay(t.completedAt)].filter(Boolean);return ds.some(d=>d>=f.from&&d<=f.to)}
    return true});
}
function renderTasks(){
  const f=S.f.tasks;const open=openSprints();
  if(!f.sprint||!open.some(s=>s.id===f.sprint)){const c=currentSprint();f.sprint=c?c.id:null}
  if(!f.quarter)f.quarter=curQuarter();
  if(!f.to){f.to=today();f.from=addDays(f.to,-7)}
  const list=filteredActive();
  const scope=f.mode==="sprint"?(f.sprint?sprintLabel(f.sprint):"No sprint selected"):f.mode==="quarter"?qLabel(f.quarter):fmtY(f.from)+" – "+fmtY(f.to);
  const curS=f.mode==="sprint"&&sprintById(f.sprint);
  let h=`<div class="viewhead"><div><h2>Tasks</h2><p>${esc(scope)}${curS&&curS.goal?" · Goal: "+esc(curS.goal):""}${(()=>{const o=list.filter(isOverdue).length,n=list.filter(t=>taskTiming(t).state==="near").length;return(o?` · <span class="due-over">${o} overdue</span>`:"")+(n?` · <span class="due-near">${n} due soon</span>`:"")})()}</p></div><div class="spacer"></div>
    <div class="acts">${curS?`<button class="btn" type="button" data-act="complete-sprint" data-id="${esc(curS.id)}"${ro()}>Complete ${esc(curS.name)}</button>`:""}<button class="btn primary" type="button" data-act="new-task"${ro()}>New task</button></div></div>${banners()}
  <div class="filters">
    <div class="fld"><span>Swimlanes</span><div class="seg" role="group">${[["subtasks","Subtasks"],["epic","Epics"],["none","None"]].map(([v,l])=>`<button type="button" data-group="${v}" aria-pressed="${f.group===v}">${l}</button>`).join("")}</div></div>
    <div class="fld"><span>View by</span><div class="seg" role="group">
      ${[["sprint","Sprint"],["quarter","Quarter"],["week","Last 7 days"]].map(([v,l])=>`<button type="button" data-mode="${v}" aria-pressed="${f.mode===v}">${l}</button>`).join("")}</div></div>
    ${f.mode==="sprint"?(open.length?`<label class="fld"><span>Sprint</span><select id="f-sprint">${open.slice().reverse().map(s=>sprintOpt(s,f.sprint)).join("")}</select></label>`:`<div class="fld"><span>Sprint</span><div class="hint">No sprints yet. <a href="#sprints">Create one</a></div></div>`):""}
    ${f.mode==="quarter"?`<label class="fld"><span>Quarter</span><select id="f-quarter">${quarterOptions(f.quarter)}</select></label>`:""}
    ${f.mode==="week"?`<label class="fld"><span>From</span><input type="date" id="f-from" value="${f.from}"></label><label class="fld"><span>To</span><input type="date" id="f-to" value="${f.to}"></label>`:""}
    <label class="fld"><span>Epic</span><select id="f-epic">${epicOptions(f.epic,{all:true})}</select></label>
    <label class="fld"><span>Member</span><select id="f-member"><option value="all">Everyone</option><option value="none"${f.member==="none"?" selected":""}>Unassigned</option>${mOpts(activeMembers(),f.member)}</select></label>
    ${rlFields("f",f)}
    <label class="fld"><span>Priority</span><select id="f-prio">${prioOptions(f.prio,true)}</select></label>
    <label class="fld"><span>Deadline</span><select id="f-timing">${[["all","Any"],["overdue","Overdue"],["near","Due soon (90%+ time used)"],["ok","On track"]].map(([v,l])=>`<option value="${v}"${f.timing===v?" selected":""}>${l}</option>`).join("")}</select></label>
    <label class="fld" style="flex:1;min-width:140px"><span>Search</span><input type="search" id="f-q" placeholder="Key (T-12), title, tag" value="${esc(f.q)}"></label>
  </div>`;
  if(f.mode==="week")h+=`<p class="note" style="margin:-8px 0 12px">Shows sprint tasks created, updated, due or completed in this date range. Backlog items are on the Sprints &amp; backlog tab.</p>`;
  if(!loading()&&f.mode==="sprint"&&!open.length){
    return h+`<div class="emptystate"><h3>Create a sprint to start the board</h3><p>Tasks are planned into sprints. Create your first sprint, then add tasks to it or pull them in from the backlog.</p>
      <div class="acts"><a class="btn primary" href="#sprints">Go to Sprints &amp; backlog</a></div></div>`;
  }
  if(loading())return h+`<div class="emptystate"><p>Loading tasks…</p></div>`;
  return h+(f.group==="epic"?boardEpicLanes(list):f.group==="none"?boardFlat(list):boardSubLanes(list));
}
function boardFlat(list){
  let h="";
  const doneCount=list.filter(t=>t.status==="done").length;
  const byP=(a,b)=>(PRANK[a.priority||"medium"]-PRANK[b.priority||"medium"])||((a.dueDate||"9")>(b.dueDate||"9")?1:-1);
  const overdue=list.filter(isOverdue).sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||""));
  h+=`<div class="board">`+STATUSES.slice(0,3).map(([s,l,c])=>{
    const items=list.filter(t=>(t.status||"todo")===s&&!isOverdue(t)).sort((a,b)=>(PRANK[a.priority||"medium"]-PRANK[b.priority||"medium"])||((a.dueDate||"9")>(b.dueDate||"9")?1:-1));
    return`<section class="col" data-drop="${s}" aria-label="${l}"><div class="colhead"><span class="dot" style="background:${c}"></span>${l}<span class="cnt">${items.length}</span></div>
      ${loading()?`<div class="empty-col">Loading…</div>`:items.length?items.map(card).join(""):`<div class="empty-col">Nothing here. Drag a card in or change its status.</div>`}</section>`}).join("")+
    `<section class="col overcol" aria-label="Overdue"><div class="colhead"><span class="dot" style="background:var(--s-over)"></span>Overdue<span class="cnt">${overdue.length}</span></div>
      ${loading()?"":overdue.length?overdue.map(card).join(""):`<div class="empty-col">Nothing past its due date. Tasks move here automatically when their deadline passes.</div>`}</section>`+
    `<section class="col donezone" data-drop="done" aria-label="Done"><div class="colhead"><span class="dot" style="background:var(--s-done)"></span>Done</div>
      <div class="big">${doneCount}</div><div>finished in this view</div><div class="note">Drop a card here to finish it.<br>Done tasks move to the Archive.</div>
      <a class="btn sm" href="#archive">Open archive</a></section></div>`;
  return h;
}
function card(t){
  const tm=taskTiming(t);const overdue=tm.state==="overdue";
  const timing=overdue?`<div class="timing due-over">Overdue by ${tm.days} day${tm.days===1?"":"s"} · was ${esc(SLABEL[t.status||"todo"])}</div>`
    :tm.state==="near"?`<div class="timing due-near"><span>Due soon</span><span class="tbar"><i style="width:${Math.min(100,tm.frac*100).toFixed(0)}%;background:var(--s-near)"></i></span><span>${Math.min(100,Math.round(tm.frac*100))}% of time used</span></div>`:"";
  return`<article class="card${overdue?" is-over":tm.state==="near"?" is-near":""}" draggable="true" data-id="${esc(t.id)}">
    <h4 data-act="edit-task" data-id="${esc(t.id)}" tabindex="0">${esc(t.title)}</h4>${timing}
    <div class="meta"><span class="key">${esc(taskKey(t))}</span>${S.f.tasks.group!=="epic"?epicChip(t.epicId):""}${subBadge(t)}${+t.estimate>0?`<span class="est" title="Estimate">${t.estimate} ${unitLabel(analysisConfig().params)}</span>`:""}${prio(t.priority)}${t.dueDate?`<span class="mono${overdue?" due-over":tm.state==="near"?" due-near":""}">due ${fmt(t.dueDate)}</span>`:""}${tagsOf(t).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}${S.f.tasks.mode!=="sprint"?`<span class="mono">${esc(sprintName(t.sprintId))}</span>`:""}</div>
    <div class="foot">${who(t.assigneeId)}<select data-status="${esc(t.id)}" aria-label="Status"${S.readOnly?" disabled":""}>${STATUSES.map(([v,l])=>`<option value="${v}"${(t.status||"todo")===v?" selected":""}>${l}</option>`).join("")}</select></div>
  </article>`;
}
async function setStatus(id,status){
  const t=S.tasks.find(x=>x.id===id);if(!t||t.status===status)return;
  const now=new Date().toISOString();
  await write(db=>db.doc("tasks/"+id).update({status,updatedAt:now,completedAt:status==="done"?now:null}),status==="done"?"Moved to Archive":"Status: "+SLABEL[status]);
}

/* ---------- SPRINTS & BACKLOG view ---------- */
function renderSprints(){
  const open=openSprints();const backlog=S.tasks.filter(t=>!t.sprintId&&t.status!=="done").sort((a,b)=>PRANK[a.priority||"medium"]-PRANK[b.priority||"medium"]||(a.createdAt||"").localeCompare(b.createdAt||""));
  const nDone=doneSprints().length;
  let h=`<div class="viewhead"><div><h2>Sprints &amp; backlog</h2><p>Plan sprints, start and complete them, and keep unscheduled work in the backlog</p></div><div class="spacer"></div>
    <div class="acts"><button class="btn" type="button" data-act="new-backlog"${ro()}>Add backlog item</button><button class="btn primary" type="button" data-act="new-sprint"${ro()}>New sprint</button></div></div>${banners()}
    <div class="subhead"><h3>Sprints</h3><p>${open.length} open${nDone?` · ${nDone} completed in the <a href="#archive" data-act="arch-sprints">Archive</a>`:""}</p></div>`;
  if(loading())h+=`<div class="emptystate"><p>Loading sprints…</p></div>`;
  else if(!open.length)h+=`<div class="emptystate"><h3>No open sprints</h3><p>Create a sprint with a name, goal and dates. The Tasks board and its sprint filter list only the sprints you create here.</p><div class="acts"><button class="btn primary" type="button" data-act="new-sprint"${ro()}>New sprint</button></div></div>`;
  else h+=`<div class="grid">`+open.map(s=>{
    const list=tasksIn(s.id);const{c,html}=stackBar(list);
    return`<article class="box${s.status==="active"?" is-active":""}"><div class="toprow"><h3>${esc(s.name)}</h3>${pill(s.status,"sp-"+(s.status||"planned"),SPLABEL[s.status]||"Planned")}</div>
      <div class="note">${fmtY(s.startDate)} – ${fmtY(s.endDate)} · ${sprintLen(s)} days · ${qLabel(quarterOf(s.startDate))}</div>
      <p class="goal${s.goal?"":" none"}">${s.goal?esc(s.goal):"No sprint goal set"}</p>
      ${html}<div class="counts">${STATUSES.map(([st,l])=>`<div><b>${c[st]}</b><span>${l}</span></div>`).join("")}</div>
      <div class="acts"><button class="btn sm" type="button" data-act="open-board" data-id="${esc(s.id)}">Open board</button>
        <button class="btn sm" type="button" data-act="sprint-workload" data-id="${esc(s.id)}">Check workload</button>
        <button class="btn sm" type="button" data-act="sprint-retro" data-id="${esc(s.id)}">Retro</button>
        ${s.status!=="active"?`<button class="btn sm" type="button" data-act="start-sprint" data-id="${esc(s.id)}"${ro()}>Start sprint</button>`:""}
        <button class="btn sm" type="button" data-act="complete-sprint" data-id="${esc(s.id)}"${ro()}>Complete sprint</button>
        <button class="btn sm ghost" type="button" data-act="edit-sprint" data-id="${esc(s.id)}"${ro()}>Edit</button></div></article>`}).join("")+`</div>`;
  h+=`<div class="subhead"><h3>Backlog</h3><p>${backlog.length} item${backlog.length===1?"":"s"} not in any sprint</p></div>`;
  if(loading())return h;
  if(!backlog.length)return h+`<div class="emptystate"><h3>Backlog is empty</h3><p>Capture work that isn't scheduled yet. Move items into a sprint when you plan it.</p><div class="acts"><button class="btn" type="button" data-act="new-backlog"${ro()}>Add backlog item</button></div></div>`;
  h+=`<div class="tablewrap"><table><thead><tr><th>Item</th><th>Assignee</th><th>Priority</th><th>Due</th><th>Move to sprint</th></tr></thead><tbody>`+
    backlog.map(t=>`<tr><td><div class="t" data-act="edit-task" data-id="${esc(t.id)}" tabindex="0"><span class="key">${esc(taskKey(t))}</span> ${esc(t.title)}</div>${t.epicId?`<div class="meta">${epicChip(t.epicId,true)}</div>`:""}${tagsOf(t).length?`<div class="meta">${tagsOf(t).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}</div>`:""}</td>
      <td>${who(t.assigneeId)}</td><td>${prio(t.priority)||'<span class="note">medium</span>'}</td><td class="mono">${dueText(t)}</td>
      <td>${open.length?`<select class="rowsel" data-move="${esc(t.id)}" aria-label="Move to sprint"${S.readOnly?" disabled":""}><option value="">Keep in backlog</option>${open.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select>`:`<span class="note">Create a sprint first</span>`}</td></tr>`).join("")+`</tbody></table></div>`;
  return h;
}

/* ---------- TEAM view ---------- */
function renderTeam(){
  const f=S.f.team;const all=activeMembers(),ina=inactiveMembers().length,cs=currentSprint();
  const act=all.filter(m=>matchRL(m,f.role,f.level)&&(!f.q||(m.name+" "+(m.email||"")).toLowerCase().includes(f.q.toLowerCase())));
  let h=`<div class="viewhead"><div><h2>Team</h2><p>${all.length} active member${all.length===1?"":"s"}${cs?" · work counts for "+esc(cs.name):""}${ina?` · ${ina} inactive in the <a href="#archive" data-act="arch-members">Archive</a>`:""}</p></div><div class="spacer"></div>
    <div class="acts">${f.tab==="members"?`<button class="btn primary" type="button" data-act="new-member"${ro()}>Add member</button>`:""}</div></div>${banners()}
    <div class="seg" role="tablist" style="margin-bottom:14px">${[["members","Team",all.length],["roles","Roles & levels",S.roles.length]].map(([v,l,n])=>`<button type="button" role="tab" data-ttab="${v}" aria-pressed="${f.tab===v}" aria-selected="${f.tab===v}">${esc(l)}<span class="n">${n}</span></button>`).join("")}</div>`;
  if(loading())return h+`<div class="emptystate"><p>Loading your team…</p></div>`;
  if(f.tab==="roles")return h+renderRoles();
  if(!all.length)h+=`<div class="emptystate"><h3>${ina?"No active members":"Add your first team member"}</h3><p>${S.roles.length?"Each member gets a role and level from the list below, plus a card showing their tasks by status.":`Set up roles and levels on the <a href="#team" data-ttab="roles">Roles &amp; levels</a> tab first, then add members and pick their role and level.`}</p><div class="acts"><button class="btn primary" type="button" data-act="new-member"${ro()}>Add member</button></div></div>`;
  else{
    h+=`<div class="filters">${rlFields("tm",f)}<label class="fld" style="flex:1;min-width:140px"><span>Search</span><input type="search" id="tm-q" value="${esc(f.q)}" placeholder="Name or email"></label>
      <p class="note" style="margin:0 0 6px">${act.length} of ${all.length} shown</p></div>`;
    if(!act.length)h+=`<div class="emptystate"><p>No active members match this role and level.</p></div>`;
    else h+=`<div class="grid">`+act.map(m=>{
      const mine=S.tasks.filter(t=>t.assigneeId===m.id);const inSprint=cs?mine.filter(t=>t.sprintId===cs.id):[];
      const{c,html}=stackBar(inSprint);
      return`<article class="box"><div class="id">${av(m,"lg")}<div><h3>${esc(m.name)}</h3><div class="role">${esc(roleText(m))}</div>${m.email?`<div class="note">${esc(m.email)}</div>`:""}</div></div>
        ${html}<div class="counts">${STATUSES.map(([s,l])=>`<div><b>${c[s]}</b><span>${l}</span></div>`).join("")}</div>
        <div class="note">${mine.filter(t=>t.status!=="done").length} open overall${(()=>{const o=mine.filter(isOverdue).length;return o?` · <span class="due-over">${o} overdue</span>`:""})()} · ${mine.filter(t=>t.status==="done").length} done all-time</div>
        <div class="acts"><button class="btn sm" type="button" data-act="member-tasks" data-id="${esc(m.id)}">View tasks</button>
        <button class="btn sm" type="button" data-act="member-archive" data-id="${esc(m.id)}">Done work</button>
        <button class="btn sm" type="button" data-act="assign" data-id="${esc(m.id)}"${ro()}>Assign task</button>
        <button class="btn sm ghost" type="button" data-act="edit-member" data-id="${esc(m.id)}"${ro()}>Edit</button></div></article>`}).join("")+`</div>`;
  }
  return h;
}
function renderRoles(){

  if(!list.length)return h+`<div class="emptystate"><p>No completed tasks match these filters.</p></div>`;

  return h;

let mermaidP=null;

let mmSeq=0;
async function runMermaid(root){
  const nodes=[...root.querySelectorAll("pre.mm-src:not([data-done])")];if(!nodes.length)return;

let prevT;
let edLinked=new Set();
function drawLinker(root){
  const chips=root.querySelector("#de-tchips"),res=root.querySelector("#de-tres"),q=(root.querySelector("#de-tsearch").value||"").trim().toLowerCase();
  chips.innerHTML=[...edLinked].map(id=>{const t=S.tasks.find(x=>x.id===id);return`<span class="chip"><span class="key">${esc(t?taskKey(t):"Deleted")}</span>${esc(t?t.title:"task")}<button type="button" class="x" data-unlink="${esc(id)}" aria-label="Unlink">×</button></span>`}).join("")||`<span class="note">No tasks linked.</span>`;
  if(!q){res.innerHTML="";return}
  const hits=S.tasks.filter(t=>!edLinked.has(t.id)&&(taskKey(t)+" "+t.title).toLowerCase().includes(q)).sort((a,b)=>(b.num||0)-(a.num||0)).slice(0,8);
  res.innerHTML=hits.length?hits.map(t=>`<button type="button" data-link="${esc(t.id)}"><span class="key">${esc(taskKey(t))}</span>${esc(t.title)}${statusPill(t,' style="margin-left:auto"')}</button>`).join(""):`<span class="note" style="padding:6px">No matching tasks.</span>`;
}
function bindEditor(root){
  {const id=S.f.docs.editing;const d=id==="new"?null:S.docs.find(x=>x.id===id);edLinked=new Set(d&&d.taskIds||[]);
   const si=root.querySelector("#de-tsearch");si.addEventListener("input",()=>drawLinker(root));drawLinker(root);
   root.addEventListener("click",e=>{const l=e.target.closest("[data-link]"),u=e.target.closest("[data-unlink]");
     if(l){edLinked.add(l.dataset.link);si.value="";root.dataset.dirty="1";drawLinker(root);si.focus()}
     if(u){edLinked.delete(u.dataset.unlink);root.dataset.dirty="1";drawLinker(root)}})}
  const ta=root.querySelector("#de-body"),prev=root.querySelector("#de-prev");
  const upd=()=>{prev.innerHTML=mdToHtml(ta.value);hydrateAssets(prev);runMermaid(prev)};upd();
  ta.addEventListener("input",()=>{root.dataset.dirty="1";clearTimeout(prevT);prevT=setTimeout(upd,450)});
  root.querySelectorAll("#de-title,#de-tags,#de-cat,#de-sprint").forEach(i=>i.addEventListener("input",()=>root.dataset.dirty="1"));
  ta.addEventListener("paste",e=>{const fs=[...(e.clipboardData&&e.clipboardData.files||[])];if(fs.length&&S.assets){e.preventDefault();fs.forEach(uploadInto)}});
  ta.addEventListener("dragover",e=>{if(S.assets&&e.dataTransfer&&[...e.dataTransfer.types].includes("Files")){e.preventDefault();ta.classList.add("drop")}});
  ta.addEventListener("dragleave",()=>ta.classList.remove("drop"));
  ta.addEventListener("drop",e=>{ta.classList.remove("drop");const fs=[...(e.dataTransfer&&e.dataTransfer.files||[])];if(fs.length&&S.assets){e.preventDefault();fs.forEach(uploadInto)}});
  root.querySelector("#de-file").addEventListener("change",e=>{[...e.target.files].forEach(uploadInto);e.target.value=""});
  root.addEventListener("click",e=>{const b=e.target.closest("[data-ins],[data-up]");if(!b)return;
    if(b.dataset.up){const fi=root.querySelector("#de-file");fi.accept=b.dataset.up;fi.click();return}
    insertMd(b.dataset.ins)});
}
function insertAt(text,selStart,selEnd){const ta=$("#de-body");if(!ta)return;const s=ta.selectionStart,e=ta.selectionEnd;
  ta.setRangeText(text,s,e,"end");if(selStart!=null){ta.setSelectionRange(s+selStart,s+(selEnd??selStart))}ta.focus();ta.dispatchEvent(new Event("input"))}
function insertMd(k){const ta=$("#de-body");const sel=ta.value.slice(ta.selectionStart,ta.selectionEnd);const nl=ta.selectionStart>0&&ta.value[ta.selectionStart-1]!=="\n"?"\n":"";
  const W=(a,b,ph)=>{const t=sel||ph;insertAt(a+t+b,a.length,a.length+t.length)};
  const B=(block,ph)=>{const t=nl+"\n"+block.replace("§",sel||ph)+"\n";const i=t.indexOf(sel||ph);insertAt(t,i,i+(sel||ph).length)};
  ({h2:()=>B("## §","Heading"),bold:()=>W("**","**","bold text"),italic:()=>W("_","_","italic text"),link:()=>W("[","](https://)","link text"),
    ul:()=>B("- §\n- ","Item"),task:()=>B("- [ ] §\n- [ ] ","To do"),quote:()=>B("> §","Quote"),
    table:()=>B("| Column | Column |\n|---|---|\n| § | |","Value"),code:()=>B("```js\n§\n```","// code"),
    mermaid:()=>B("```mermaid\n§\n```","sequenceDiagram\n  participant App\n  participant API\n  App->>API: GET /tasks\n  API-->>App: 200 OK"),
    imgurl:()=>B("![§](https://example.com/image.png)","description"),vidurl:()=>B("![video: §](https://example.com/clip.mp4)","description")})[k]()}
async function uploadInto(file){
  const st=$("#de-up");const name=file.name||"pasted file";
  const ext=(name.split(".").pop()||"").toLowerCase();
  const TEXT={csv:"text/csv",md:"text/markdown",json:"application/json",txt:"text/plain"};
  const opts=!file.type||/charset|ms-excel/.test(file.type)?(TEXT[ext]?{type:TEXT[ext]}:{}):{};
  if(st)st.textContent="Uploading "+name+"…";
  try{const r=await S.assets.upload(file,opts);const url=r.path;const t=r.contentType||"";const label=name.replace(/[\[\]]/g,"");
    const snippet=t.startsWith("image/")?`![${label}](${url})`:t.startsWith("video/")?`![video: ${label}](${url})`:`[${label} (${(r.sizeBytes/1024).toFixed(0)} KB)](${url})`;
    const ta=$("#de-body");if(ta){const nl=ta.selectionStart>0&&ta.value[ta.selectionStart-1]!=="\n"?"\n":"";insertAt(nl+snippet+"\n")}
    if(st)st.textContent="Uploaded "+name;
  }catch(e){const c=e&&e.code;const msg=c==="too_large"?"is too large (25 MB max). Link to long videos on YouTube or Loom instead":c==="unsupported_type"?"isn't a supported type (images, MP4/WebM, PDF, text)":c==="quota_or_state"?"couldn't be stored: file storage is full":c==="not_granted"?"needs Editor access to upload":"couldn't be uploaded. Try again.";
    if(st)st.textContent=name+" "+msg;toast(name+" "+msg)}
}
async function saveDoc(){

    assets:[...new Set(body.match(/assets\/[^)\s"']+/g)||[])]};
  const st=$("#de-state");if(st)st.textContent="Saving…";

}

/* ---------- color picker ---------- */
const paletteColors=()=>((S.settings.find(x=>x.id==="palette")||{}).colors||[]).map(normColor).filter(Boolean);
const PRESET_SET=()=>new Set([...COLORS,...EPIC_COLORS,...EXTRA_COLORS].map(normColor));
/* Presets, then the team's saved colors (removable), then a "+" swatch that opens a full color picker. */
function colorPicker(name,idp,presets,current){
  const cur=normColor(current);const pre=[...new Set([...presets,...EXTRA_COLORS].map(normColor))];
  const saved=paletteColors().filter(c=>!pre.includes(c));const all=[...pre,...saved];
  if(cur&&!all.includes(cur))saved.push(cur),all.push(cur);
  const sw=(c,i,removable)=>`<label title="${c}"><input type="radio" name="${name}" id="${idp}${i}" value="${c}"${cur===c?" checked":""}><span style="background:${c}"></span>${removable?`<button type="button" class="swx" data-act="rm-color" data-color="${c}" aria-label="Remove ${c} from the team palette">×</button>`:""}</label>`;
  return`<div class="swatches" data-cname="${name}">${all.map((c,i)=>sw(c,i,i>=pre.length&&paletteColors().includes(c))).join("")}
    <label class="add" title="Add a color"><input type="color" data-cpick="${name}" id="${idp}pick" value="${cur||"#3366cc"}" aria-label="Pick a new color"><span aria-hidden="true">+</span></label></div>
    <span class="swhint">Pick a swatch or press + to choose any color. New colors are saved to the team palette.</span>`;
}
/* Save a newly picked color to the shared palette (settings/palette). */
async function ensurePalette(db,c){c=normColor(c);if(!c||PRESET_SET().has(c))return;const pal=paletteColors();if(pal.includes(c))return;
  await db.doc("settings/palette").set({colors:[...pal,c],updatedAt:new Date().toISOString()})}

function doneCell(n){return`<div class="cell donecell" data-drop="done" data-label="Done"><div class="big">${n}</div><div class="note">done. Drop a task here to finish it; it moves to the Archive.</div></div>`}
function boardSubLanes(list){
  const parents=list.filter(t=>t.status!=="done"&&subsOf(t.id).length).sort(byPrio);
  const others=list.filter(t=>t.status!=="done"&&!subsOf(t.id).length);
  const doneN=list.filter(t=>t.status==="done").length;
  if(!parents.length&&!others.length)return`<div class="emptystate"><p>No open tasks in this view.${doneN?` ${doneN} done.`:""}</p></div>`;
  let h=`<div class="lanes">`+laneCols();
  for(const t of parents){
    const subs=subsOf(t.id),dn=subs.filter(x=>x.status==="done").length,tm=taskTiming(t),key=t.id,closed=S.collapsed.has(key);
    const{html}=stackBar(subs);

/* --- expression language --- */
function compileExpr(src){
  const s=String(src||"").trim();if(!s)throw new Error("Write a formula");
  const toks=[];const re=/\s*(?:(\d+(?:\.\d+)?)|([A-Za-z_]\w*)|(>=|<=|==|!=|&&|\|\||[-+*/%()<>,!=]))/y;
  while(re.lastIndex<s.length){const at=re.lastIndex;const m=re.exec(s);
    if(!m){if(/^\s*$/.test(s.slice(at)))break;throw new Error(`Can't read "${s.slice(at).trim().slice(0,15)}"`)}
    if(m[1])toks.push({t:"num",v:+m[1]});
    else if(m[2]){const w=m[2].toLowerCase();
      if(w==="and")toks.push({t:"op",v:"&&"});else if(w==="or")toks.push({t:"op",v:"||"});else if(w==="not")toks.push({t:"op",v:"!"});
      else if(w==="true"||w==="false")toks.push({t:"num",v:w==="true"?1:0});else toks.push({t:"id",v:m[2]})}
    else toks.push({t:"op",v:m[3]==="="?"==":m[3]})}
  let i=0;const ids=new Set();
  const eat=v=>{if(toks[i]&&toks[i].t==="op"&&toks[i].v===v){i++;return true}return false};
  const need=v=>{if(!eat(v))throw new Error(toks[i]?`Expected "${v}" before "${toks[i].v}"`:`Expected "${v}" at the end`)};
  const T=x=>x!==0&&!Number.isNaN(x);
  const FN={min:(...a)=>Math.min(...a),max:(...a)=>Math.max(...a),abs:Math.abs,round:(x,d=0)=>{const p=10**d;return Math.round(x*p)/p}};
  const orE=()=>{let a=andE();while(eat("||")){const l=a,r=andE();a=c=>T(l(c))||T(r(c))?1:0}return a};
  const andE=()=>{let a=notE();while(eat("&&")){const l=a,r=notE();a=c=>T(l(c))&&T(r(c))?1:0}return a};
  const notE=()=>{if(eat("!")){const x=notE();return c=>T(x(c))?0:1}return cmpE()};
  const cmpE=()=>{const l=addE();for(const op of[">=","<=","==","!=",">","<"])if(eat(op)){const r=addE();
      return{">=":c=>l(c)>=r(c)?1:0,"<=":c=>l(c)<=r(c)?1:0,"==":c=>Math.abs(l(c)-r(c))<1e-9?1:0,"!=":c=>Math.abs(l(c)-r(c))<1e-9?0:1,">":c=>l(c)>r(c)?1:0,"<":c=>l(c)<r(c)?1:0}[op]}
    return l};
  const addE=()=>{let a=mulE();for(;;){if(eat("+")){const l=a,r=mulE();a=c=>l(c)+r(c)}else if(eat("-")){const l=a,r=mulE();a=c=>l(c)-r(c)}else return a}};
  const mulE=()=>{let a=unE();for(;;){if(eat("*")){const l=a,r=unE();a=c=>l(c)*r(c)}else if(eat("/")){const l=a,r=unE();a=c=>{const d=r(c);return d?l(c)/d:0}}else if(eat("%")){const l=a,r=unE();a=c=>{const d=r(c);return d?l(c)%d:0}}else return a}};
  const unE=()=>{if(eat("-")){const x=unE();return c=>-x(c)}if(eat("+"))return unE();return prim()};
  const prim=()=>{const t=toks[i];if(!t)throw new Error("The formula ends too early");
    if(t.t==="num"){i++;return()=>t.v}
    if(t.t==="id"){i++;const name=t.v,fn=name.toLowerCase();
      if(eat("(")){const args=[];if(!eat(")")){do args.push(orE());while(eat(","));need(")")}
        if(fn==="if"){if(args.length!==3)throw new Error("if() needs 3 parts: if(condition, then, otherwise)");const[a,b,c3]=args;return c=>T(a(c))?b(c):c3(c)}
        if(!FN[fn])throw new Error(`Unknown function "${name}". Use min, max, abs, round or if.`);
        if(!args.length)throw new Error(`${fn}() needs at least one value`);return c=>FN[fn](...args.map(f=>f(c)))}

    throw new Error(`Unexpected "${t.v}"`)};
  const fn=orE();if(i<toks.length)throw new Error(`Unexpected "${toks[i].v}"`);
  return{fn,ids:[...ids]};
}
const exprCache=new Map();

/* Check a formula against the names it may use. Returns an error message or "". */
function checkExpr(src,known){const c=compiled(src);if(c.error)return c.error;const bad=c.ids.filter(x=>!known.has(x));return bad.length?`Unknown name${bad.length>1?"s":""}: ${bad.join(", ")}`:""}

/* --- config profiles: "wl" = Workload, "rv" = Reviews. Each has its own metrics, default fields, rules and assumptions,
   saved as one document in analysis/<doc>. --- */
const PROFILES={};
function profConfig(pk){const pr=PROFILES[pk];const d=S.analysis.find(x=>x.id===pr.doc);const p=(d&&d.params)||{};
  const params=Object.assign({},pr.params,p);
  if(pk==="wl"){params.levelFactors=Object.assign({},p.levelFactors||{});params.weekend=Array.isArray(p.weekend)?p.weekend:pr.params.weekend}
  return{params,fields:d&&Array.isArray(d.fields)?d.fields:pr.fields,rules:d&&Array.isArray(d.rules)?d.rules:pr.rules,saved:!!d}}
function saveProf(pk,patch,msg){const c=profConfig(pk);
  return write(db=>db.doc("analysis/"+PROFILES[pk].doc).set({params:c.params,fields:c.fields,rules:c.rules,...patch,updatedAt:new Date().toISOString()}),msg)}
const analysisConfig=()=>profConfig("wl");
const saveAnalysisConfig=(patch,msg)=>saveProf("wl",patch,msg);
const knownNames=(pk,fields,exceptKey)=>new Set([...Object.keys(PROFILES[pk].metrics),...fields.filter(f=>f.key!==exceptKey).map(f=>f.key)]);
/* Evaluate fields for every row, then the rules. groups: [{target:"member"|"role",rows}] */
function evalFieldsAndRules(pk,cfg,groups,ruleOn,P){
  const M=PROFILES[pk].metrics;const errors=[];const findings=[];
  const evalRow=r=>{const memo={},busy=new Set();
    const get=name=>{if(name in memo)return memo[name];
      const f=cfg.fields.find(x=>x.key===name&&x.expr);
      if(f){if(busy.has(name))throw new Error(`"${name}" refers to itself`);busy.add(name);const c=compiled(f.expr);if(c.error)throw new Error(`Field "${f.label}": ${c.error}`);
        let v;try{v=c.fn(get)}finally{busy.delete(name)}return memo[name]=v}
      if(name in M)return r[name];
      throw new Error(`Unknown name "${name}"`)};
    r.values={};r.flags=[];for(const f of cfg.fields){try{r.values[f.key]=f.expr?get(f.key):r[f.key]}catch(e){r.values[f.key]=NaN;if(!errors.includes(e.message))errors.push(e.message)}}
    r.get=get;return r};
  groups.forEach(g=>g.rows.forEach(evalRow));
  const fmtFor=name=>{const f=cfg.fields.find(x=>x.key===name);return f?f.format:M[name]?M[name][1]:"number"};
  for(const rule of cfg.rules){if(rule.enabled===false||!ruleOn(rule))continue;
    const c=compiled(rule.when);if(c.error){errors.push(`Rule "${rule.name}": ${c.error}`);continue}
    const g=groups.find(x=>x.target===(rule.target||"member"));if(!g)continue;
    for(const r of g.rows){let hit=false;try{hit=c.fn(r.get)!==0}catch(e){errors.push(`Rule "${rule.name}": ${e.message}`);break}
      if(hit){const msg=String(rule.message||"").replace(/\{(\w+)\}/g,(m0,n)=>{if(n==="name")return r.name;try{return fmtVal(r.get(n),fmtFor(n),P)}catch(e){return m0}});
        r.flags.push({rule,msg});findings.push({target:g.target,rowId:r.id,name:r.name,rule,msg})}}}
  const sevRank={high:0,warn:1,info:2,good:3};findings.sort((a,b)=>sevRank[a.rule.severity]-sevRank[b.rule.severity]||a.name.localeCompare(b.name));
  return{errors:[...new Set(errors)],findings};
}
const unitLabel=P=>P.unit==="hours"?"h":"pts";
function fmtVal(v,fmt,P){
  if(v==null||Number.isNaN(v))return"–";if(!Number.isFinite(v))return"∞";
  const r1=Math.round(v*10)/10;
  return fmt==="percent"?Math.round(v)+"%":fmt==="effort"?r1+" "+unitLabel(P):fmt==="count"?String(Math.round(v)):fmt==="days"?r1+" d":String(r1);
}
function defaultLevelFactor(level){
  const l=String(level||"").toLowerCase();
  if(/intern|trainee|junior|\bjr\b|associate|entry|graduate/.test(l))return 0.65;
  if(/lead|principal|staff|architect|manager|head/.test(l))return 0.7;
  if(/senior|\bsr\b/.test(l))return 0.85;

const levelFactorOf=(m,P)=>{const k=String(m&&m.level||"").toLowerCase();const v=P.levelFactors[k];return v!=null&&v!==""&&!Number.isNaN(+v)?+v:defaultLevelFactor(m&&m.level)};
function quarterRange(q){const[y,n]=q.split("-Q").map(Number);const a=`${y}-${pad(3*(n-1)+1)}-01`;const b=addDays(n===4?`${y+1}-01-01`:`${y}-${pad(3*n+1)}-01`,-1);return[a,b]}

  for(let d=a;d<=b;d=addDays(d,1)){const wd=new Date(utc(d)).getUTCDay();if(!P.weekend.includes(wd)&&!hol.has(d))n++}return n}

/* --- engine --- */
function runAnalysis(){
  const W=S.f.wl;const cfg=analysisConfig();const P=cfg.params;const sprintScope=W.scope==="sprint";
  let scopeTasks,range,label,sprintsIn;
  if(sprintScope){const sp=sprintById(W.sprint);if(!sp){toast("Pick a sprint first");return}
    scopeTasks=S.tasks.filter(t=>t.sprintId===sp.id);range=[sp.startDate,sp.endDate];label=sp.name+" · "+fmt(sp.startDate)+" – "+fmt(sp.endDate);sprintsIn=[sp]}
  else{const q=W.quarter;scopeTasks=S.tasks.filter(t=>taskQuarter(t)===q);range=quarterRange(q);label=qLabel(q);sprintsIn=S.sprints.filter(s=>s.startDate&&quarterOf(s.startDate)===q)}
  const buffer=(sprintScope?P.sprintBuffer:P.quarterBuffer)/100;const baseDays=workDaysBetween(range[0],range[1],P);
  const eff=x=>+x.estimate>0?+x.estimate:+P.defaultEstimate||0;
  const people=new Map();
  const blank=m=>({id:m?m.id:"__none",m,planned:0,remaining:0,tasks:0,openTasks:0,doneTasks:0,inProgress:0,onTest:0,subtasksOpen:0,overdue:0,dueSoon:0,carryOver:0,
    dues:[],epics:new Set(),highPriority:0,unestimated:0});
  const row=id=>{const key=id&&memberById(id)?id:"__none";if(!people.has(key))people.set(key,blank(memberById(id)));return people.get(key)};
  activeMembers().forEach(m=>row(m.id));
  for(const t of scopeTasks){
    const subs=subsOf(t.id);const open=t.status!=="done";const r=row(t.assigneeId);
    r.tasks++;open?r.openTasks++:r.doneTasks++;
    if(open){if(t.status==="in-progress")r.inProgress++;if(t.status==="on-test")r.onTest++;
      const tm=taskTiming(t);if(tm.state==="overdue")r.overdue++;if(tm.state==="near")r.dueSoon++;
      if((t.carryCount||0)>0)r.carryOver++;if(t.dueDate)r.dues.push(t.dueDate);if(t.epicId)r.epics.add(t.epicId);
      if(t.priority==="urgent"||t.priority==="high")r.highPriority++}
    const subEst=subs.some(x=>+x.estimate>0);
    if(subs.length){
      for(const x of subs){const o=row(x.assigneeId||t.assigneeId);const e=subEst?eff(x):eff(t)/subs.length;
        o.planned+=e;if(x.status!=="done"&&open)o.remaining+=e;
        if(x.status!=="done"){o.subtasksOpen+=x.assigneeId?1:0;if(x.assigneeId&&x.assigneeId!==t.assigneeId){if(x.status==="in-progress")o.inProgress++;if(x.status==="on-test")o.onTest++}}
        if(subEst&&!(+x.estimate>0))o.unestimated++}
      if(!subEst&&!(+t.estimate>0))r.unestimated++;
    }else{const e=eff(t);r.planned+=e;if(open)r.remaining+=e;if(!(+t.estimate>0))r.unestimated++}
  }
  const finish=r=>{const m=r.m;
    const leave=m?sprintsIn.reduce((a,s)=>a+(+((s.leave||{})[m.id])||0),0):0;
    const lf=m?levelFactorOf(m,P):0;const base=m?(+m.capacity>0?+m.capacity:P.baseCapacity*lf):0;
    const work=Math.max(0,baseDays-leave);const capacity=m?base*work/(+P.refDays||10)*(1-buffer):0;
    const d=r.dues.sort();let cl=0;for(let a=0;a<d.length;a++){let n=0;for(let b=a;b<d.length&&d[b]<=addDays(d[a],(+P.dueWindow||3)-1);b++)n++;cl=Math.max(cl,n)}
    return{id:r.id,name:m?m.name:"Unassigned",member:m,roleId:m?m.roleId||"":"",capacity,planned:r.planned,remaining:r.remaining,free:capacity-r.planned,
      load:capacity>0?r.planned/capacity*100:(r.planned>0?999:0),tasks:r.tasks,openTasks:r.openTasks,doneTasks:r.doneTasks,inProgress:r.inProgress,onTest:r.onTest,
      subtasksOpen:r.subtasksOpen,overdue:r.overdue,dueSoon:r.dueSoon,carryOver:r.carryOver,dueCluster:cl,epicCount:r.epics.size,epicSet:r.epics,
      epicsOwned:m?S.epics.filter(e=>e.status!=="done"&&e.ownerId===m.id).length:0,highPriority:r.highPriority,unestimated:r.unestimated,
      levelFactor:lf,leaveDays:leave,workDays:work,members:1}};
  const all=[...people.values()].map(finish);
  const unassigned=all.find(r=>r.id==="__none")||{planned:0,openTasks:0};
  const rows=all.filter(r=>r.member&&(isActive(r.member)||r.tasks));
  /* roles */
  const roleRows=[];const byRole=new Map();rows.forEach(r=>{const k=r.roleId||"";if(!byRole.has(k))byRole.set(k,[]);byRole.get(k).push(r)});
  for(const[k,list]of byRole){const sum=f=>list.reduce((a,r)=>a+r[f],0);const ep=new Set();list.forEach(r=>r.epicSet.forEach(x=>ep.add(x)));
    const cap=sum("capacity"),pl=sum("planned");const rr={id:"role:"+k,name:k?(roleById(k)||{}).name||"Removed role":"No role"};
    ["capacity","planned","remaining","tasks","openTasks","doneTasks","inProgress","onTest","subtasksOpen","overdue","dueSoon","carryOver","epicsOwned","highPriority","unestimated","leaveDays","workDays","members"].forEach(f=>rr[f]=sum(f));
    Object.assign(rr,{free:cap-pl,load:cap>0?pl/cap*100:(pl>0?999:0),dueCluster:Math.max(0,...list.map(r=>r.dueCluster)),epicCount:ep.size,levelFactor:list.length?sum("levelFactor")/list.length:0});
    roleRows.push(rr)}
  roleRows.sort((a,b)=>a.name.localeCompare(b.name));
  /* fields + rules */
  const{errors,findings}=evalFieldsAndRules("wl",cfg,[{target:"member",rows},{target:"role",rows:roleRows}],rule=>rule.scope==="both"||rule.scope===W.scope,P);
  /* rebalancing suggestions */
  const effTask=t=>{const subs=subsOf(t.id);return subs.some(x=>+x.estimate>0)?subs.reduce((a,x)=>a+eff(x),0):eff(t)};
  const suggestions=suggestMoves(rows,scopeTasks,P,effTask);
  const cap=rows.reduce((a,r)=>a+r.capacity,0),pl=rows.reduce((a,r)=>a+r.planned,0);
  S.wl={scope:W.scope,sprintId:sprintScope?W.sprint:null,label,at:new Date(),rows,roleRows,findings,errors,suggestions,P,fields:cfg.fields,
    unassigned:{effort:unassigned.planned||0,count:scopeTasks.filter(t=>!t.assigneeId&&t.status!=="done").length},
    team:{capacity:cap,planned:pl,load:cap>0?pl/cap*100:0,days:baseDays}};
  render();
}
function suggestMoves(rows,scopeTasks,P,eff){
  const target=(+P.targetLoad||90)/100;const room={};rows.forEach(r=>room[r.id]=r.capacity*target-r.planned);
  const moves=[];const used=new Set();
  const pick=(t,fromId,roleId)=>{const e=eff(t);const heavy=t.priority==="urgent"||t.priority==="high";
    let pool=rows.filter(r=>r.id!==fromId&&r.member&&isActive(r.member)&&room[r.id]>=e&&(!roleId||r.roleId===roleId));
    if(heavy&&pool.some(r=>r.levelFactor>=0.75))pool=pool.filter(r=>r.levelFactor>=0.75);
    pool.sort((a,b)=>room[b.id]-room[a.id]);return pool[0]};
  const movable=t=>t.status==="todo"&&subsOf(t.id).every(x=>!x.assigneeId||x.assigneeId===t.assigneeId);
  for(const o of rows.filter(r=>r.load>(+P.overloadAt||100)).sort((a,b)=>b.load-a.load)){
    let excess=-room[o.id];
    const cands=scopeTasks.filter(t=>t.assigneeId===o.id&&movable(t)).sort((a,b)=>PRANK[b.priority||"medium"]-PRANK[a.priority||"medium"]||eff(a)-eff(b));
    for(const t of cands){if(excess<=0)break;const roleId=t.roleId||o.roleId||"";const to=pick(t,o.id,roleId);if(!to)continue;
      const e=eff(t);moves.push({taskId:t.id,from:o.id,to:to.id,effort:e,why:`${o.name} is at ${Math.round(o.load)}%`});
      room[to.id]-=e;room[o.id]+=e;excess-=e;used.add(t.id)}}
  for(const t of scopeTasks.filter(t=>!t.assigneeId&&t.status!=="done"&&!used.has(t.id)).sort((a,b)=>PRANK[a.priority||"medium"]-PRANK[b.priority||"medium"])){
    const to=pick(t,null,t.roleId||"");if(!to)continue;room[to.id]-=eff(t);moves.push({taskId:t.id,from:null,to:to.id,effort:eff(t),why:"Unassigned"})}
  return moves;
}

function addMonths(s,n){const[y,m,d]=s.split("-").map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();
  return t.getUTCFullYear()+"-"+pad(t.getUTCMonth()+1)+"-"+pad(Math.min(d,last))}

/* The window being reviewed. Half-yearly and yearly reviews end on the chosen date (today by default) and reach back 6 or 12 months. */
function reviewWindow(){const F=S.f.rv;
  if(F.tab==="retro"){const sp=sprintById(F.sprint);if(!sp)return null;return{mode:"sprint",key:"sprint-"+sp.id,label:sp.name+" · "+fmt(sp.startDate)+" – "+fmtY(sp.endDate),start:sp.startDate,end:sp.endDate,sprint:sp}}

  const end=F.end||today();const months=F.period==="half"?6:12;const start=addDays(addMonths(end,-months),1);
  return{mode:F.period,key:F.period+"-"+end,label:(months===6?"Half-yearly":"Yearly")+" · "+fmtY(start)+" – "+fmtY(end),start,end};
}
const reviewDocId=(key,mid)=>(key+"--"+mid).replace(/[^A-Za-z0-9_.~:@+-]/g,"_");
const reviewOf=(key,mid)=>S.reviews.find(x=>x.id===reviewDocId(key,mid));
function runReview(){
  const win=reviewWindow();if(!win){toast("Pick a sprint first");return}
  const cfg=profConfig("rv"),RP=cfg.params,WP=profConfig("wl").params;
  const inWin=d=>!!d&&d>=win.start&&d<=win.end;const sprintMode=win.mode==="sprint";
  const asOf=win.end<today()?win.end:today();
  const eff=x=>+x.estimate>0?+x.estimate:+WP.defaultEstimate||0;
  const sprintsIn=sprintMode?[win.sprint]:S.sprints.filter(s=>inWin(s.startDate));const sprintIds=new Set(sprintsIn.map(s=>s.id));
  const inScope=t=>sprintMode?(t.sprintId===win.sprint.id||(t.sprintHistory||[]).includes(win.sprint.id))
    :(inWin(isoDay(t.completedAt))||(t.sprintId&&sprintIds.has(t.sprintId))||(t.sprintHistory||[]).some(x=>sprintIds.has(x))||(!t.sprintId&&inWin(t.dueDate)));
  const doneIn=t=>t.status==="done"&&(sprintMode?t.sprintId===win.sprint.id:inWin(isoDay(t.completedAt)));
  const subDone=x=>x.status==="done"&&(sprintMode||inWin(isoDay(x.completedAt)));
  const scopeTasks=S.tasks.filter(inScope);
  const people=new Map();
  const row=id=>{if(!id||!memberById(id))return null;if(!people.has(id))people.set(id,{m:memberById(id),committed:0,completed:0,effortCommitted:0,effortDone:0,doneWithDue:0,onTime:0,late:0,
    overdueNow:0,carriedOver:0,cycles:[],subtasksDone:0,highPriorityDone:0,epics:new Set(),unestimated:0,sprintsDone:new Set(),doneList:[],openList:[],lateList:[]});return people.get(id)};
  activeMembers().forEach(m=>row(m.id));
  let unassignedOpen=0;
  for(const t of scopeTasks){
    const done=doneIn(t);const r=row(t.assigneeId);
    if(!r){if(!done)unassignedOpen++}
    else{r.committed++;
      if(done){r.completed++;r.doneList.push(t.id);
        if(t.dueDate){r.doneWithDue++;const cd=isoDay(t.completedAt)||asOf;if(cd<=addDays(t.dueDate,+RP.lateGraceDays||0))r.onTime++;else{r.late++;r.lateList.push(t.id)}}
        const st=t.startDate||isoDay(t.createdAt);if(st&&t.completedAt)r.cycles.push(Math.max(0,(utc(isoDay(t.completedAt))-utc(st))/864e5));
        if(t.priority==="urgent"||t.priority==="high")r.highPriorityDone++;if(t.epicId)r.epics.add(t.epicId);
        if(t.sprintId)r.sprintsDone.add(t.sprintId)}
      else{r.openList.push(t.id);if(t.dueDate&&t.dueDate<asOf)r.overdueNow++}
      if((t.carryCount||0)>0&&(!sprintMode||(t.sprintHistory||[]).includes(win.sprint.id)))r.carriedOver++}
    const subs=subsOf(t.id),subEst=subs.some(x=>+x.estimate>0);
    const units=subEst?subs.map(x=>({o:x.assigneeId||t.assigneeId,e:eff(x),done:subDone(x)||done,est:+x.estimate>0})):[{o:t.assigneeId,e:eff(t),done,est:+t.estimate>0}];
    for(const u of units){const ro=row(u.o);if(!ro)continue;ro.effortCommitted+=u.e;if(u.done){ro.effortDone+=u.e;if(!u.est)ro.unestimated++}}
    for(const x of subs){const rx=row(x.assigneeId);if(rx&&subDone(x))rx.subtasksDone++}
  }
  const meetings=S.meetings.filter(m=>inWin(m.date));
  const buffer=(sprintMode?WP.sprintBuffer:WP.quarterBuffer)/100;const elapsed=workDaysBetween(win.start,asOf,WP);
  const rows=[...people.values()].filter(r=>isActive(r.m)||r.committed).map(r=>{const m=r.m;
    const leave=sprintsIn.reduce((a,s)=>a+(+((s.leave||{})[m.id])||0),0);const lf=levelFactorOf(m,WP);const base=+m.capacity>0?+m.capacity:WP.baseCapacity*lf;
    const expected=base*Math.max(0,elapsed-leave)/(+WP.refDays||10)*(1-buffer);
    const att=meetings.filter(x=>(x.attendees||[]).includes(m.id)).length;const rv=reviewOf(win.key,m.id);
    return{id:m.id,name:m.name,member:m,roleId:m.roleId||"",committed:r.committed,completed:r.completed,unfinished:r.committed-r.completed,
      completionRate:r.committed?r.completed/r.committed*100:0,effortCommitted:r.effortCommitted,effortDone:r.effortDone,expectedEffort:expected,
      deliveryVsExpected:expected>0?r.effortDone/expected*100:0,doneWithDue:r.doneWithDue,onTime:r.onTime,late:r.late,onTimeRate:r.doneWithDue?r.onTime/r.doneWithDue*100:100,
      overdueNow:r.overdueNow,carriedOver:r.carriedOver,avgCycleDays:r.cycles.length?r.cycles.reduce((a,b)=>a+b,0)/r.cycles.length:0,subtasksDone:r.subtasksDone,
