const GUIDE_ID="cohort-guide";
const GUIDE_MD=/*GUIDE_MD*/"Cohort is a team workspace for planning and running sprints. It keeps your people, epics, tasks, sprints, meetings, docs, workload analysis and performance reviews in one place, and stores every record as a file in your own GitHub repository.\n\nOpen this guide any time from **Help** in the top bar. It's an ordinary doc, so you can edit it to add your team's own conventions. If you delete it, **Help** offers to add it back.\n\n**Contents**\n\n1. How Cohort works\n2. A typical cycle\n3. Tasks\n4. Epics and subtasks\n5. Sprints & backlog\n6. Workload\n7. Reviews\n8. Team and roles\n9. Meetings\n10. Docs\n11. Archive\n12. Formulas and rules\n13. Colors, deleting and other details\n14. Where data lives\n15. Access and privacy\n\n---\n\n## 1. How Cohort works\n\nCohort is a single web page served by GitHub Pages. There is no server and no database: the page talks straight to the GitHub API with your personal access token, and each change you make becomes one commit in your repository.\n\n```mermaid\nflowchart LR\n  U[\"You in the browser\"] -->|\"open the site\"| P[\"GitHub Pages<br/>index.html + config.js\"]\n  U -->|\"sign in with a token\"| A[\"GitHub API\"]\n  A -->|\"read: one query loads all data\"| R[(\"Your repo<br/>data/ and assets/\")]\n  U -->|\"save, move, delete\"| A\n  A -->|\"write: one commit per change\"| R\n  R -->|\"checked every 30 s\"| U\n```\n\n- **Reading.** When you sign in, Cohort loads every file under `data/` in one request. It then checks the branch every 30 seconds and reloads when someone else has committed, so teammates see each other's changes without refreshing.\n- **Writing.** Every save is a commit with a readable message such as `Update task: T-12 Build login API`. Saves are queued, so quick edits never overwrite each other. If two people change the same file at the same moment, Cohort retries against the newer version.\n- **History.** Because every change is a commit, the repository history is a full audit log. You can see who changed what, and restore anything with Git.\n- **Publishing.** The Pages workflow publishes only `index.html` and `config.js`. Changes to `data/` and `assets/` don't redeploy the site.\n\n`config.js` tells the page which repository to use:\n\n```js\nwindow.COHORT_CONFIG = {\n  owner: \"arunism\",   // GitHub user or organization\n  repo: \"cohort\",     // repository name\n  branch: \"main\"      // branch that holds data/ and assets/\n};\n```\n\n---\n\n## 2. A typical cycle\n\n```mermaid\nflowchart TD\n  Q[\"Quarter planning<br/>Meetings → Quarter planning\"] --> E[\"Create epics<br/>Epics tab\"]\n  E --> B[\"Add tasks to the backlog<br/>Sprints & backlog\"]\n  B --> SP[\"Plan the next sprint<br/>move tasks in, set estimates\"]\n  SP --> W{\"Workload:<br/>anyone overloaded?\"}\n  W -->|\"yes\"| RB[\"Rebalance<br/>use the suggested moves\"]\n  RB --> W\n  W -->|\"no\"| ST[\"Start the sprint\"]\n  ST --> D[\"Daily work<br/>board, standups, product calls\"]\n  D --> C[\"Complete the sprint<br/>unfinished work moves on\"]\n  C --> RT[\"Sprint retro<br/>Reviews → Sprint retro\"]\n  RT --> SP\n  RT -.->|\"every quarter, half-year, year\"| PR[\"Performance review<br/>Reviews → Performance review\"]\n```\n\n1. **Plan the quarter.** Record a Quarter planning meeting, then create the epics for the quarter.\n2. **Fill the backlog.** Add tasks with estimates, priorities and the role they need.\n3. **Plan the sprint.** Create the sprint, move tasks into it, and run **Workload** to check that nobody is over capacity. Apply the suggested moves or reassign by hand.\n4. **Run the sprint.** Start it, work the board, and log standups and product calls under **Meetings**.\n5. **Close the sprint.** Complete it on its end date, or early if you need to. Choose where unfinished work goes.\n6. **Retro.** Open **Reviews → Sprint retro** to see how each person's sprint went, write notes and record team action items.\n7. **Review periodically.** Every quarter, half-year or year, run **Reviews → Performance review** for that period.\n\n---\n\n## 3. Tasks\n\nThe **Tasks** tab is the board. Choose what it shows with the three view modes:\n\n| View | Shows | Default |\n|---|---|---|\n| **Sprint** | Tasks in one sprint | The active sprint |\n| **Quarter** | Tasks whose sprint starts in that quarter. Tasks without a sprint use their due date, or the date they were created. | The current quarter |\n| **Week** | Sprint tasks created, updated, due or completed between two dates | The last 7 days, up to today |\n\nYou can also filter by epic, member, role, level, priority and deadline, and group the board in three ways:\n\n- **Subtasks:** each task with subtasks gets its own swimlane, so you can see the progress of each subtask across the columns.\n- **Epic:** one lane per epic.\n- **None:** a flat board.\n\nLanes can be collapsed, and Cohort remembers this in your browser.\n\n### Task statuses\n\n```mermaid\nstateDiagram-v2\n  [*] --> ToDo\n  ToDo --> InProgress\n  InProgress --> OnTest\n  OnTest --> InProgress: bug found\n  OnTest --> Done\n  Done --> [*]\n  ToDo --> Overdue: due date passes\n  InProgress --> Overdue: due date passes\n  OnTest --> Overdue: due date passes\n  Overdue --> Done\n```\n\n- **To do**, **In progress**, **On test** and **Done** are the statuses you set.\n- **Overdue** is automatic. Once the due date passes and the task isn't done, it shows in the Overdue column. It returns to its normal column if you move the due date.\n- **Nearly due.** A task's card turns orange once 90% of the time from its start date to its due date has passed.\n- **Done tasks** leave the board and move to the **Archive**.\n\n### Task fields\n\n| Field | Meaning |\n|---|---|\n| **ID** | `T-1`, `T-2`, … assigned automatically and never reused. Subtasks use their own sequence (`ST-1`, …), and so do epics (`E-1`, …). |\n| **Title** | Short name of the work. |\n| **Description** | Acceptance criteria, links and context. |\n| **Assignee** | The person doing it. Only active members can be chosen. |\n| **Status** | To do, In progress, On test or Done. |\n| **Sprint** | The sprint it belongs to, or **Backlog** if it isn't planned yet. |\n| **Epic** | The larger piece of work it contributes to (optional). |\n| **Estimate** | Size in points or hours. The unit is set in Workload → Assumptions. Empty estimates count as the default size in analysis. |\n| **Role needed** | The role that should do this work. Workload uses it when suggesting reassignments. |\n| **Priority** | Low, Medium, High or Urgent. |\n| **Start date** | When work starts. Used for the 90% warning and cycle time. |\n| **Due date** | Deadline. Drives Overdue, due-date clusters and on-time rate. |\n| **Tags** | Free labels such as `api` or `mobile`. |\n| **Subtasks** | Smaller steps, added inside the task dialog. |\n\n---\n\n## 4. Epics and subtasks\n\nCohort follows the same hierarchy as Jira:\n\n```mermaid\nflowchart LR\n  E[\"Epic E-3<br/>Checkout redesign\"] --> T1[\"Task T-12<br/>Payment API\"]\n  E --> T2[\"Task T-13<br/>Checkout UI\"]\n  T1 --> S1[\"Subtask ST-40<br/>Write tests\"]\n  T1 --> S2[\"Subtask ST-41<br/>Error handling\"]\n  T2 --> S3[\"Subtask ST-42<br/>Mobile layout\"]\n```\n\n**Epic fields.**\n\n| Field | Meaning |\n|---|---|\n| **Title** | Name of the epic. |\n| **Description** | Goal, scope and success criteria. |\n| **Status** | To do, In progress or Done. Done epics move to the Archive. |\n| **Owner** | The person accountable for it. |\n| **Start date** | When work on the epic starts. |\n| **Target date** | When it should be finished. |\n| **Color** | Used for its label on cards and lanes. |\n\nThe Epics tab shows each epic's progress from its tasks.\n\n**Subtasks** have their own status, assignee and estimate. On the board grouped by **Subtasks**, each parent task becomes a lane, and its subtasks move across the columns, so you can see exactly which steps are stuck. Subtask estimates count towards the assignee's workload.\n\n---\n\n## 5. Sprints & backlog\n\n```mermaid\nstateDiagram-v2\n  [*] --> Planned: create\n  Planned --> Active: start\n  Active --> Completed: complete (on time or early)\n  Completed --> [*]\n```\n\n**Sprint fields.**\n\n| Field | Meaning |\n|---|---|\n| **Name** | For example `Sprint 7`. |\n| **Start date** | First day of the sprint. |\n| **End date** | Last day of the sprint. |\n| **Sprint goal** | What the sprint should achieve. |\n| **Status** | Planned, Active or Completed. |\n| **Review notes** | Short notes written when the sprint is completed. |\n\n- **Backlog.** Tasks with no sprint live in the backlog. Move them into a sprint from here or from the task dialog.\n- **Completing a sprint.** Use **Complete sprint** at any time, including before the end date. Cohort lists the unfinished tasks and lets you move them to the next sprint or back to the backlog. Each moved task records that it was carried over and which sprints it passed through. Workload and Reviews use this history.\n- **Completed sprints** move to the **Archive**. Each one has a **Retro** button.\n- **Sprint filters.** The sprint filters across the app list only sprints that exist.\n\n---\n\n## 6. Workload\n\nUse Workload before you commit to a sprint or quarter. It shows who is overloaded and who has room, taking each person's role and level into account. Press **Run analysis**. The built-in fields and rules work without any setup.\n\n```mermaid\nflowchart LR\n  A[\"Assumptions<br/>capacity, buffers, holidays\"] --> C[\"Capacity per person\"]\n  M[\"Member level and leave\"] --> C\n  T[\"Tasks and subtasks<br/>estimates, dates, status\"] --> L[\"Planned load\"]\n  C --> F[\"Fields<br/>numbers per person and role\"]\n  L --> F\n  F --> R[\"Rules<br/>conditions to findings\"]\n  R --> O[\"Findings and<br/>suggested moves\"]\n```\n\n### How capacity is worked out\n\nCapacity is the effort someone can realistically take on in the period. The **Base capacity** is what a full-capacity person delivers in the **Reference days**, and a person's **Capacity override** replaces the first two terms below.\n\n```text\ncapacity = base capacity × level factor\n           × (working days − leave) ÷ reference days\n           × (1 − buffer)\n```\n\n- **Working days** exclude weekends and the public holidays you list.\n- **Buffer** is the share kept free for surprises: 20% per sprint and 25% per quarter by default.\n- **Level factor** is guessed from the level name: junior, intern or associate 0.65, mid or senior 0.85, lead, principal or manager 0.7. You can override it per level.\n- **Leave days** for a sprint are typed straight into the Leave column of the results table.\n\n### Default workload metrics\n\n| Metric | Meaning |\n|---|---|\n| `capacity` | Plannable effort for the period after level, leave, holidays and buffer |\n| `planned` | Effort assigned in the period (task and subtask estimates) |\n| `remaining` | Planned effort that isn't done yet |\n| `free` | Capacity minus planned effort (negative means over) |\n| `load` | Planned effort as a percentage of capacity |\n| `tasks` / `openTasks` / `doneTasks` | Tasks assigned, still open, or done |\n| `inProgress` / `onTest` | Items in those columns right now |\n| `subtasksOpen` | Subtasks assigned and not done |\n| `overdue` | Open tasks past their due date |\n| `dueSoon` | Open tasks with 90% or more of their time used |\n| `carryOver` | Open tasks carried over from an earlier sprint |\n| `dueCluster` | Most open tasks due within any window of N days |\n| `epicCount` | Different epics among open tasks (context switching) |\n| `epicsOwned` | Open epics this person owns |\n| `highPriority` | Open urgent or high-priority tasks |\n| `unestimated` | Items with no estimate (the default size was used) |\n| `levelFactor` | Capacity factor for the person's level |\n| `leaveDays` / `workDays` | Leave in the period, and working days left after holidays and leave |\n| `members` | 1 for a person, the head count for a role |\n| `stress` *(formula)* | `load/25 + inProgress + overdue*2 + carryOver + max(dueCluster-2, 0)` |\n\n### Default workload rules\n\n| Rule | Condition | Severity |\n|---|---|---|\n| Over capacity | `load > 100` | High |\n| No slack | `load >= 90 and load <= 100` | Warning |\n| Has room | `capacity > 0 and load < 70` | Good |\n| Nothing assigned | `capacity > 0 and tasks = 0` | Info |\n| Too much in progress *(sprint)* | `inProgress >= 3` | Warning |\n| Overdue pile-up | `overdue >= 2` | High |\n| Deadlines bunched up *(sprint)* | `dueCluster >= 3` | Warning |\n| Repeated carry-over | `carryOver >= 2` | Warning |\n| Heavy load for a junior | `levelFactor < 0.75 and highPriority >= 3` | Warning |\n| Spread across epics *(quarter)* | `epicCount >= 3` | Warning |\n| Owns many epics *(quarter)* | `epicsOwned >= 3` | Warning |\n| High stress score | `stress >= 8` | High |\n| Missing estimates | `unestimated >= 1` | Info |\n| Role over capacity *(role)* | `load > 100` | High |\n| Role has room *(role)* | `capacity > 0 and load < 70` | Good |\n\n**Suggested moves.** Cohort proposes moving open work from overloaded people to people with room who have the role the task needs. Press **Assign** to apply a move.\n\n### Workload assumptions\n\n| Setting | Meaning | Default |\n|---|---|---|\n| **Effort unit** | Points or hours | Points |\n| **Default size for unestimated items** | Size used when a task has no estimate | 3 |\n| **Capacity of a full-capacity person** | Base capacity over the reference days | 20 per 10 days |\n| **Sprint buffer** | Share of a sprint kept free | 20% |\n| **Quarter buffer** | Share of a quarter kept free | 25% |\n| **Public holidays** | Dates excluded from working days | none |\n| **Due-date window** | Days used for `dueCluster` | 3 |\n| **Overloaded above** | Load at which someone counts as overloaded | 100% |\n| **Healthy target** | Load that suggested moves aim for | 90% |\n| **Has room below** | Load below which someone can take more work | 70% |\n| **Level factors** | Factor for each level | from the level name |\n| **Capacity override** | A fixed capacity for one person | none |\n\n---\n\n## 7. Reviews\n\nReviews turn each person's work into conversation starters for retros and performance reviews. Treat the numbers as prompts, not verdicts. They can't see mentoring, code reviews, support work or anything that never became a task.\n\n### Sprint retro\n\n- Opens on the last completed sprint. You can pick any sprint, or press **Retro** on a sprint card or in the Archive.\n- Shows team totals: completed of committed, effort done compared with expected, on-time rate, and unfinished work.\n- Lists findings for each person, grouped as **Strength**, **Watch**, **Needs support** and **Note**.\n- Open a person to see the tasks they finished and didn't finish, then write their note:\n  - **Rating:** 1 needs significant improvement, 2 below expectations, 3 meets expectations, 4 exceeds expectations, 5 outstanding.\n  - **What went well**, **What to improve** and **Commitments for next sprint**.\n- **Team retro** notes (went well, improve, action items) are saved with the sprint.\n\n### Performance review\n\n| Period | Window |\n|---|---|\n| **Quarterly** | The calendar quarter you pick |\n| **Half-yearly** | The 6 months up to today, or up to an end date you choose |\n| **Yearly** | The 12 months up to that end date |\n\nHalf-yearly and yearly reviews are relative: change the end date and the window moves with it. Each person's past reviews are listed under **Saved reviews**.\n\n### Default review metrics\n\n| Metric | Meaning |\n|---|---|\n| `committed` | Tasks they owned in the period (planned, due or finished in it) |\n| `completed` / `unfinished` | Owned tasks finished, or not finished, in the period |\n| `completionRate` | Completed ÷ committed |\n| `effortCommitted` / `effortDone` | Effort of the work they owned, and of the work they finished |\n| `expectedEffort` | What their capacity allowed, using the Workload assumptions, their level, holidays and leave |\n| `deliveryVsExpected` | Effort done ÷ expected effort |\n| `effortVsTeam` | Effort done compared with the team average (100 = average) |\n| `doneWithDue` / `onTime` / `late` | Finished tasks with a due date, and how many were on time or late |\n| `onTimeRate` | On time ÷ finished tasks with a due date |\n| `overdueNow` | Open tasks past their due date at the end of the period |\n| `carriedOver` | Their tasks moved on to a later sprint |\n| `avgCycleDays` / `cycleVsTeam` | Average days from start to finish, and that time compared with the team (higher is slower) |\n| `subtasksDone` / `highPriorityDone` | Subtasks finished, and urgent or high-priority tasks finished |\n| `epicsContributed` | Different epics among the tasks they finished |\n| `meetingsHeld` / `meetingsAttended` / `attendance` | Meetings logged, meetings attended, and the attendance rate |\n| `sprintsInPeriod` / `sprintsWithDone` | Sprints in the period, and sprints where they finished something |\n| `unestimated` | Finished items with no estimate |\n| `rating` | The 1–5 rating saved in their review for this period (0 if none) |\n| `levelFactor` / `leaveDays` | Their level factor and leave |\n| `score` *(formula)* | `min(completionRate,100)*0.35 + min(onTimeRate,100)*0.25 + min(deliveryVsExpected,100)*0.25 + min(attendance,100)*0.15` |\n\n### Default review rules\n\n| Rule | Condition | Shown as |\n|---|---|---|\n| Delivered the commitment | `committed >= 2 and completionRate >= 90` | Strength |\n| Reliable on deadlines | `doneWithDue >= 3 and onTimeRate >= 90` | Strength |\n| Handled high-priority work | `highPriorityDone >= 3` | Strength |\n| Delivered above expectation | `expectedEffort > 0 and deliveryVsExpected >= 110` | Strength |\n| Consistent output *(periods)* | `sprintsInPeriod >= 3 and sprintsWithDone >= sprintsInPeriod * 0.8` | Strength |\n| Low completion | `committed >= 2 and completionRate >= 40 and completionRate < 70` | Watch |\n| Most work unfinished | `committed >= 2 and completionRate < 40` | Needs support |\n| Often late | `late >= 2 and onTimeRate < 70` | Watch |\n| Overdue work piling up | `overdueNow >= 3` | Needs support |\n| Repeated carry-over | `carriedOver >= 2` | Watch |\n| Slower than the team | `completed >= 3 and cycleVsTeam >= 150` | Watch |\n| Delivery below expectation *(periods)* | `expectedEffort > 0 and deliveryVsExpected < 60` | Watch |\n| Low meeting attendance | `meetingsHeld >= 4 and attendance < 70` | Note |\n| No work in this period | `committed = 0` | Note |\n| Missing estimates | `unestimated >= 3` | Note |\n\n**Review assumptions:** **Grace days** is how many days after the due date a task can finish and still count as on time (default 0). Capacity settings come from Workload.\n\nReview fields and rules are stored separately from Workload's, so editing one never changes the other.\n\n---\n\n## 8. Team and roles\n\nThe Team tab has two sub-tabs.\n\n**Team.**\n\n| Field | Meaning |\n|---|---|\n| **Name** | The person's name. |\n| **Role** | Chosen from the roles that exist. |\n| **Level** | Chosen from that role's levels. |\n| **Email** | Optional. |\n| **Status** | Active or Inactive. Inactive members move to the Archive and can't be assigned work. |\n| **Color** | Used for their avatar. |\n\nFilter the team by role and level.\n\n**Roles.** Add a role, such as *Backend engineer*, then add or remove its levels, such as *Junior*, *Mid*, *Senior* or *Lead*. Members can only be given roles and levels that exist here. Level names also set default capacity factors in Workload.\n\n---\n\n## 9. Meetings\n\n| Type | Template |\n|---|---|\n| **Daily standup** | Yesterday, today, blockers |\n| **Weekly product call** | Progress, demos and shipped work, risks and open questions, decisions |\n| **Sprint planning** | Sprint goal, committed work, capacity and leave, carry-over. Links to the sprint being planned. |\n| **Quarter planning** | Objectives, key results, major initiatives, risks and dependencies. Links to the quarter being planned. |\n\nEach meeting also records a **Date**, a **Title**, **Attendees**, **Notes**, **Decisions** and **Action items**. Attendance feeds the attendance metrics in Reviews.\n\n---\n\n## 10. Docs\n\nDocs are written in Markdown with a live preview, and can contain:\n\n- **Images and videos:** drag them in or use the upload button. They're stored in `assets/`, and each upload is limited to 25 MB.\n- **Diagrams:** a `mermaid` code block draws flowcharts, sequence diagrams, state diagrams and more, like the diagrams in this guide.\n- **Code** with syntax highlighting, **tables** and links.\n\nEach doc has a **Category** (Spec, Architecture, Design, How-to, Runbook, Reference, Release notes, Notes or Other), **Tags**, an optional **Linked sprint** and optional **Linked tasks**. Linked tasks appear at the top of the doc, and clicking one opens it. Search docs by text, and filter by category or content type.\n\n---\n\n## 11. Archive\n\n| Tab | Holds |\n|---|---|\n| **Tasks** | Done tasks. Filter by text, member, epic, sprint, quarter, priority, tag or completion date range. |\n| **Epics** | Done epics. |\n| **Sprints** | Completed sprints, with how much was done and carried over, and a **Retro** button. |\n| **Members** | Inactive members. They can be made active again. |\n\n---\n\n## 12. Formulas and rules\n\nWorkload and Reviews each have **Fields**, **Rules** and **Assumptions** tabs. You can add, edit, reorder, switch off or delete any field or rule, and **Reset to defaults** brings back the built-in set. The defaults run with one click, so customizing is optional.\n\n### Fields\n\nA field is a column in the results. It is either a **metric** (one of the built-in numbers above) or a **formula** built from metrics and other fields. Each field has:\n\n- a **Label**\n- a **Key** used to refer to it in rules\n- a **Format**: effort, percent, whole number, number or days\n- a choice of whether it shows for people, for roles, or both\n\n### Rules\n\nA rule raises a finding when its condition is true.\n\n| Part | Meaning |\n|---|---|\n| **Name** | Shown on the finding. |\n| **Condition** | A formula that is true or false, for example `load > 100`. |\n| **Applies to** | People or roles. For Workload: sprint, quarter or both. For Reviews: retros, all reviews, or only quarterly, half-yearly or yearly ones. |\n| **Severity** | Workload: High, Warning, Info or Good. Reviews: Needs support, Watch, Note or Strength. |\n| **Message** | Text shown with the finding. `{metric}` inserts a value, for example `Planned {planned} against {capacity}`. |\n\n### Formula language\n\n| You can use | Examples |\n|---|---|\n| Numbers and metric or field keys | `3`, `load`, `stress` |\n| Arithmetic | `+  -  *  /  %` and brackets |\n| Comparisons | `>  >=  <  <=  =  !=` |\n| Logic | `and`, `or`, `not` |\n| Functions | `min(a, b)`, `max(a, b)`, `abs(x)`, `round(x)`, `if(cond, a, b)` |\n\nExample rules:\n\n```text\nload > 110 and levelFactor < 0.75          junior far over capacity\nrating >= 4 and onTimeRate >= 95           strong review and reliable\nif(expectedEffort > 0, effortDone / expectedEffort, 0) < 0.5\n```\n\nThe editor checks each formula as you type and lists every metric you can use.\n\n---\n\n## 13. Colors, deleting and other details\n\n- **Colors.** Members and epics offer 20 preset colors, including black, white and grays. Use **+** to pick any color. Picked colors join a shared team palette, and you can remove them from it. Text on light colors switches to dark automatically.\n- **Deleting.** Any delete asks you to type a short word shown on screen, such as POOF or ZAP, and press Enter. This stops accidental deletes without slowing you down.\n- **Top bar.** Shows the active sprint, how far into it you are, and the current quarter.\n- **Remembered settings.** Board grouping, view mode and collapsed lanes are remembered per browser.\n- **Read-only access.** People with read-only access can browse everything but can't save.\n\n---\n\n## 14. Where data lives\n\n| Folder | Contents | File name |\n|---|---|---|\n| `data/members/` | Team members | random id |\n| `data/roles/` | Roles and their levels | random id |\n| `data/epics/` | Epics | `E-<n>.json` |\n| `data/tasks/` | Tasks | `T-<n>.json` |\n| `data/subtasks/` | Subtasks | `ST-<n>.json` |\n| `data/sprints/` | Sprints, leave, retro notes | random id |\n| `data/meetings/` | Meeting records | random id |\n| `data/docs/` | Docs, including this guide (`cohort-guide.json`) | random id |\n| `data/analysis/` | Workload settings (`config.json`) and review settings (`review.json`) | fixed |\n| `data/reviews/` | Individual reviews and ratings | `<period>--<member>` |\n| `data/settings/` | Team color palette | fixed |\n| `assets/` | Uploaded images, videos and files | upload name |\n\nEvery file is plain JSON, so you can edit records by hand or with scripts. Keep each file valid JSON; Cohort skips files it can't read.\n\n---\n\n## 15. Access and privacy\n\n- **Visiting the site isn't enough.** Opening the site doesn't show any data. To read data, a person needs a GitHub token with access to the repository.\n- **Changing data** needs a token with *Contents: read and write* permission. Anyone without one can't change anything.\n- **Tokens** are stored only in that person's browser. Use fine-grained tokens limited to this one repository.\n- **Reviews are sensitive.** They are stored in `data/reviews/` and anyone who can read the repository can read them. Keep the repository **private** and limit who has read access.\n";
function renderHelp(){
  if(S.docs.some(d=>d.id===GUIDE_ID))return renderDocs();
  const h=`<div class="viewhead"><div><h2>Help</h2><p>How Cohort works and what every field means</p></div></div>${banners()}`;
  if(loading())return h+`<div class="emptystate"><p>Loading…</p></div>`;
  return h+`<div class="emptystate"><h3>The Cohort guide isn't in your Docs yet</h3><p>It explains every page and field, with flow diagrams. It's saved as an ordinary doc, so you can edit it for your team.</p>
    <button class="btn primary" type="button" data-act="add-guide"${ro()}>Add the guide to Docs</button></div>`;
}
async function addGuide(){const now=new Date().toISOString();
  const ok=await write(db=>db.doc("docs/"+GUIDE_ID).set({title:"Cohort guide",category:"How-to",tags:["help","guide"],sprintId:null,taskIds:[],body:GUIDE_MD,assets:[],createdAt:now,updatedAt:now}),"Guide added to Docs");
  if(ok){S.f.docs.sel=GUIDE_ID;S.f.docs.editing=null;render()}}
const VIEWS={help:renderHelp,tasks:renderTasks,epics:renderEpics,sprints:renderSprints,workload:renderWorkload,reviews:renderReviews,team:renderTeam,meetings:renderMeetings,docs:renderDocs,archive:renderArchive};
function render(){
  renderClock();
  const main=$("#main");
  const act=document.activeElement;const aid=act&&act.id;let pos=null;try{pos=act&&act.selectionStart}catch(e){}
  const keep={};main.querySelectorAll("input[id^='new-role'],input[id^='lvl-']").forEach(i=>{if(i.value)keep[i.id]=i.value});
  const kept={};main.querySelectorAll("[data-keep]").forEach(n=>{kept[n.getAttribute("data-keep")]=n;n.remove()});
  if(!S.db){main.innerHTML=signInHtml();return}
  main.innerHTML=VIEWS[S.view]();
  main.querySelectorAll("[data-keep]").forEach(n=>{const k=n.getAttribute("data-keep");if(kept[k])n.replaceWith(kept[k]);else fillKeep(n)});
  for(const k in keep){const el=document.getElementById(k);if(el)el.value=keep[k]}
  if(aid){const el=document.getElementById(aid);if(el&&main.contains(el)){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
}
function route(){const h=location.hash.slice(1);S.view=VIEWS[h]?h:"tasks";if(S.view==="help"){S.f.docs.sel=GUIDE_ID;S.f.docs.editing=null}render();window.scrollTo(0,0)}

/* ---------- dialogs ---------- */
const dlg=$("#dlg"),form=$("#dlgForm");
let onSubmit=null;
function openDialog(title,body,{submitLabel="Save",del=null,wide=false,delLabel=""}={}){
  dlg.classList.toggle("wide",wide);
  form.innerHTML=`<h2 class="dh">${esc(title)}</h2><div class="db">${body}</div><div class="df">
    ${del?`<button class="btn danger" type="button" id="dlgDel">Delete</button>`:""}<div class="spacer"></div>
    <button class="btn" type="button" id="dlgCancel">Cancel</button><button class="btn primary" type="submit" id="dlgOk"${ro()}>${esc(submitLabel)}</button></div>`;
  $("#dlgCancel").onclick=()=>dlg.close();
  if(del){const b=$("#dlgDel");b.onclick=async()=>{if(!await confirmDelete(delLabel||"this item"))return;b.disabled=true;if(await del())dlg.close();else b.disabled=false}}
  dlg.showModal();const first=form.querySelector("input:not([type=radio]):not([type=checkbox]),select,textarea");if(first)first.focus();
}
form.addEventListener("submit",async e=>{e.preventDefault();if(!onSubmit)return;const ok=$("#dlgOk");ok.disabled=true;const r=await onSubmit(new FormData(form));ok.disabled=false;if(r!==false)dlg.close()});

function taskDialog(t,preset={}){
  const isNew=!t;
  if(isNew){const f=S.f.tasks;const cs=currentSprint();t={status:"todo",priority:"medium",sprintId:f.mode==="sprint"&&f.sprint?f.sprint:cs?cs.id:null,epicId:f.epic!=="all"&&f.epic!=="none"?f.epic:null,...preset}}
  const sprints=openSprints();const cur=sprintById(t.sprintId);if(cur&&cur.status==="completed")sprints.push(cur);
  const assignees=activeMembers();const curM=memberById(t.assigneeId);if(curM&&!isActive(curM))assignees.push(curM);
  openTaskId=isNew?null:t.id;
  openDialog(isNew?(t.sprintId?"New task":"New backlog item"):taskKey(t)+" · "+(t.title||"Task"),`
    <label class="full">Title<input name="title" id="t-title" required maxlength="200" value="${esc(t.title||"")}"></label>
    <label class="full">Description<textarea name="description" id="t-desc" placeholder="Acceptance criteria, links, context">${esc(t.description||"")}</textarea></label>
    <label>Assignee<select name="assigneeId" id="t-assignee"><option value="">Unassigned</option>${mOpts(assignees,t.assigneeId||"")}</select></label>
    <label>Status<select name="status" id="t-status">${STATUSES.map(([v,l])=>`<option value="${v}"${t.status===v?" selected":""}>${l}</option>`).join("")}</select></label>
    <label>Sprint<select name="sprintId" id="t-sprint"><option value="">Backlog (no sprint)</option>${sprints.map(s=>sprintOpt(s,t.sprintId)).join("")}</select></label>
    <label>Epic<select name="epicId" id="t-epic">${epicOptions(t.epicId||"")}</select></label>

/* ---------- delete confirmation: type a short word ---------- */
const cdlg=$("#cdlg");
const CF_WORDS=["poof","zap","toss","scrap","bye","drop","yeet","bin","nuke","gone"];
function confirmDelete(what){
  return new Promise(resolve=>{
    const word=CF_WORDS[Math.floor(Math.random()*CF_WORDS.length)];
    const finish=v=>{cdlg.onclose=null;if(cdlg.open)cdlg.close();resolve(v)};
    cdlg.onclose=()=>resolve(false);
    cdlg.innerHTML=`<div class="cf"><h2 class="dh">Delete ${esc(what)}?</h2>
      <p class="cf-sub">This can't be undone. Type the word to confirm.</p>
      <div class="cf-body"><div class="ty-word" id="ty-word" aria-hidden="true">${[...word].map(c=>`<span>${c}</span>`).join("")}</div>
        <input id="ty-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="${word.length}" aria-label="Type ${word} to confirm"></div>
      <p class="cf-msg" id="cf-msg" role="status">Type <b>${word.toUpperCase()}</b>, then press Enter</p>
      <div class="df"><div class="spacer"></div><button type="button" class="btn" id="cf-cancel">Cancel</button><button type="button" class="btn danger armed" id="cf-ok" disabled>Delete</button></div></div>`;
    const inp=$("#ty-in"),box=$("#ty-word"),btn=$("#cf-ok"),msg=$("#cf-msg");let prev="";
    const upd=()=>{const v=inp.value.toLowerCase();let n=0;while(n<v.length&&v[n]===word[n])n++;
      if(v.length>prev.length&&n<v.length){box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake")}
      prev=v;[...box.children].forEach((el,i)=>{el.classList.toggle("hit",i<n);el.classList.toggle("cur",i===n&&n<word.length)});
      const ok=v===word;btn.disabled=!ok;msg.innerHTML=ok?"Press <b>Enter</b> or Delete":n<v.length?"Not quite, check the letters":`Type <b>${word.toUpperCase()}</b>, then press Enter`};
    inp.oninput=upd;
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(!btn.disabled)finish(true)}};
    $("#cf-cancel").onclick=()=>finish(false);
    btn.onclick=()=>{if(!btn.disabled)finish(true)};
    upd();cdlg.showModal();inp.focus();
  });
}

    write(async db=>{await db.doc("tasks/"+id).update({assigneeId:to,updatedAt:now});for(const x of subsOf(id).filter(x=>from&&x.assigneeId===from))await db.doc("subtasks/"+x.id).update({assigneeId:to,updatedAt:now})},
      taskKey(t)+" assigned to "+((memberById(to)||{}).name||"")).then(ok=>ok&&runAnalysis())}
  else if(a==="new-field")fieldDialog(pk);
  else if(a==="edit-field")fieldDialog(pk,profConfig(pk).fields.find(f=>f.key===id));
  else if(a==="del-field"){const c=profConfig(pk);const f=c.fields.find(x=>x.key===id);const used=c.rules.filter(r=>new RegExp("\\b"+id+"\\b").test(r.when)).length;
    confirmDelete(`field "${f.label}"${used?` (used by ${used} rule${used>1?"s":""})`:""}`).then(ok=>ok&&saveProf(pk,{fields:c.fields.filter(x=>x.key!==id)},"Field deleted"))}
  else if(a==="field-move"){const c=profConfig(pk);const i=c.fields.findIndex(x=>x.key===id),j=i+(+b.dataset.dir);if(i<0||j<0||j>=c.fields.length)return;
    const fs=c.fields.slice();[fs[i],fs[j]]=[fs[j],fs[i]];saveProf(pk,{fields:fs})}
  else if(a==="reset-fields")confirmDelete("your custom fields (the default fields come back)").then(ok=>ok&&saveProf(pk,{fields:PROFILES[pk].fields},"Fields reset to defaults"));
  else if(a==="new-rule")ruleDialog(pk);
  else if(a==="edit-rule")ruleDialog(pk,profConfig(pk).rules.find(r=>r.id===id));
  else if(a==="del-rule"){const c=profConfig(pk);const r=c.rules.find(x=>x.id===id);confirmDelete(`rule "${r.name}"`).then(ok=>ok&&saveProf(pk,{rules:c.rules.filter(x=>x.id!==id)},"Rule deleted"))}
  else if(a==="reset-rules")confirmDelete("your custom rules (the default rules come back)").then(ok=>ok&&saveProf(pk,{rules:PROFILES[pk].rules},"Rules reset to defaults"));
  else if(a==="reset-params")confirmDelete("your custom assumptions (the defaults come back)").then(ok=>ok&&saveProf(pk,{params:PROFILES[pk].params},"Assumptions reset to defaults"));
  else if(a==="run-review")runReview();
  else if(a==="open-review")reviewDialog(id);
  else if(a==="sprint-retro"){S.f.rv={...S.f.rv,tab:"retro",sprint:id};location.hash="reviews";render();runReview()}
  else if(a==="goto-wl-params"){S.f.wl.tab="params"}
  else if(a==="edit-epic")epicDialog(epicById(id));
  else if(a==="epic-add-task")taskDialog(null,{epicId:id});
  else if(a==="epic-board"){S.f.tasks.epic=id;S.f.tasks.group="subtasks";location.hash="tasks";render()}
  else if(a==="toggle-lane"){S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);LS.set("cohort-lanes",[...S.collapsed]);render()}
  else if(a==="parent-done")setStatus(id,"done");
  else if(a==="edit-task")taskDialog(S.tasks.find(t=>t.id===id));
  else if(a==="new-member")memberDialog();
  else if(a==="edit-member")memberDialog(memberById(id));
  else if(a==="assign")taskDialog(null,{assigneeId:id});
  else if(a==="reactivate")write(db=>db.doc("members/"+id).update({status:"active",inactiveSince:null}),"Member reactivated");
  else if(a==="member-tasks"){S.f.tasks.member=id;location.hash="tasks"}
  else if(a==="member-archive"){S.f.arch={...ARCH0,member:id};location.hash="archive";render()}
  else if(a==="arch-sprints"){S.f.arch.tab="sprints"}
  else if(a==="arch-members"){S.f.arch.tab="members"}
  else if(a==="add-role"){const n=$("#new-role").value.trim();if(!n)return toast("Type a role name first");
    if(S.roles.some(r=>r.name.toLowerCase()===n.toLowerCase()))return toast("That role already exists");
    const levels=[...new Set($("#new-role-levels").value.split(",").map(x=>x.trim()).filter(Boolean))];
    write(db=>db.collection("roles").add({name:n,levels,createdAt:new Date().toISOString()}),"Role added").then(ok=>{if(ok){const a=$("#new-role"),b2=$("#new-role-levels");if(a)a.value="";if(b2)b2.value=""}})}
  else if(a==="add-level"){const r=roleById(id);const inp=document.getElementById("lvl-"+id);const n=inp.value.trim();if(!n)return;
    if((r.levels||[]).some(l=>l.toLowerCase()===n.toLowerCase()))return toast("That level already exists");
    write(db=>db.doc("roles/"+id).update({levels:[...(r.levels||[]),n]}),"Level added").then(ok=>{const i=document.getElementById("lvl-"+id);if(ok&&i)i.value=""})}
  else if(a==="rm-level"){const r=roleById(id),lv=b.dataset.level;
    confirmDelete(`level "${lv}" from ${r.name}`).then(ok=>ok&&write(async db=>{await db.doc("roles/"+id).update({levels:(r.levels||[]).filter(l=>l!==lv)});
      for(const m of S.members.filter(m=>m.roleId===id&&m.level===lv))await db.doc("members/"+m.id).update({level:null})},"Level removed"))}
  else if(a==="rm-role"){const r=roleById(id);confirmDelete(`role "${r?r.name:""}"`).then(ok=>ok&&
    write(async db=>{for(const m of S.members.filter(m=>m.roleId===id))await db.doc("members/"+m.id).update({roleId:null,level:null});await db.doc("roles/"+id).delete()},"Role deleted"))}
  else if(a==="rename-role"){const r=roleById(id);openDialog("Rename role",`<label class="full">Role name<input name="name" id="rr-name" required maxlength="60" value="${esc(r.name)}"></label>`);
    onSubmit=fd=>{const n=String(fd.get("name")).trim();if(!n)return false;return write(db=>db.doc("roles/"+id).update({name:n}),"Role renamed")}}
  else if(a==="add-subtask")addSubtask(id);
  else if(a==="del-subtask"){const x=S.subtasks.find(y=>y.id===id);confirmDelete("subtask "+subKey(x)).then(ok=>ok&&write(db=>db.doc("subtasks/"+id).delete(),"Subtask deleted"))}
  else if(a==="goto-doc"){dlg.close();S.f.docs.sel=id;S.f.docs.editing=null;if(S.view!=="docs")location.hash="docs";else render()}
  else if(a==="new-doc"){S.f.docs.editing="new";if(S.view!=="docs")location.hash="docs";render()}
  else if(a==="open-doc"){const ed=document.querySelector('[data-keep^="edit-"]');if(ed&&ed.dataset.dirty&&!b.classList.contains("armed")){document.querySelectorAll(".dl-item.armed").forEach(x=>x.classList.remove("armed"));b.classList.add("armed");toast("You have unsaved changes. Click again to discard them.");return}
    S.f.docs.sel=id;S.f.docs.editing=null;if(S.view==="help"&&id!==GUIDE_ID){location.hash="docs";return}render();window.scrollTo(0,0)}
  else if(a==="close-doc"){S.f.docs.sel=null;if(S.view==="help")location.hash="docs";else render()}
  else if(a==="edit-doc"){S.f.docs.editing=id;render()}
  else if(a==="cancel-doc"){const ed=document.querySelector('[data-keep^="edit-"]');if(ed&&ed.dataset.dirty&&!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Discard changes?";return}
    if(S.f.docs.editing==="new")S.f.docs.sel=null;S.f.docs.editing=null;render()}
  else if(a==="save-doc")saveDoc();
  else if(a==="add-guide")addGuide();
  else if(a==="del-doc"){const d=S.docs.find(x=>x.id===id);confirmDelete(`doc "${d?d.title:""}"`).then(ok=>ok&&
    write(db=>db.doc("docs/"+id).delete(),"Doc deleted").then(ok=>{if(ok){S.f.docs.sel=null;render()}}))}
  else if(a==="copy-code"){const code=b.closest(".codeblk").querySelector("code");const txt=code.textContent;
    const done=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1500)};
    try{navigator.clipboard.writeText(txt).then(done,()=>{const r=document.createRange();r.selectNodeContents(code);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);b.textContent="Press Ctrl+C"})}
    catch(e){const r=document.createRange();r.selectNodeContents(code);const sl=getSelection();sl.removeAllRanges();sl.addRange(r)}}
  else if(a==="toggle-prev"){const sp=$("#de-split");sp.classList.toggle("show-prev");b.textContent=sp.classList.contains("show-prev")?"Write":"Preview"}
  else if(a==="new-sprint")sprintDialog();
  else if(a==="edit-sprint")sprintDialog(sprintById(id));
  else if(a==="start-sprint"){const others=S.sprints.filter(x=>x.status==="active"&&x.id!==id);
    write(async db=>{await db.doc("sprints/"+id).update({status:"active"});for(const o of others)await db.doc("sprints/"+o.id).update({status:"planned"})},others.length?"Sprint started. "+others.map(o=>o.name).join(", ")+" set back to planned.":"Sprint started")}
  else if(a==="complete-sprint")completeDialog(sprintById(id));
  else if(a==="reopen-sprint")write(db=>db.doc("sprints/"+id).update({status:"planned",completedAt:null}),"Sprint reopened");
  else if(a==="open-board"){S.f.tasks.mode="sprint";S.f.tasks.sprint=id;location.hash="tasks"}
  else if(a==="sprint-done-tasks"){S.f.arch={...ARCH0,sprint:id};render()}
  else if(a==="new-meeting")meetingDialog(null,S.f.mtg.type!=="all"?S.f.mtg.type:"daily");
  else if(a==="edit-meeting")meetingDialog(S.meetings.find(m=>m.id===id));
  else if(a==="toggle-mtg"){const art=b.closest(".mtg");art.classList.toggle("open");b.textContent=art.classList.contains("open")?"Collapse":"Expand"}
  else if(a==="reopen")setStatus(id,"on-test");
  else if(a==="clear-arch"){S.f.arch={...ARCH0};render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="st-new"){e.preventDefault();const b=document.querySelector('[data-act="add-subtask"]');b&&b.click();return}
  if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("st-title")){e.preventDefault();e.target.blur();return}
  if(e.key==="Enter"&&e.target.id==="de-tsearch"){e.preventDefault();const f=document.querySelector("#de-tres button");f&&f.click();return}
  if(e.key==="Enter"&&e.target.id&&(e.target.id.startsWith("lvl-")||e.target.id==="new-role"||e.target.id==="new-role-levels")){e.preventDefault();const btn=e.target.id.startsWith("lvl-")?e.target.nextElementSibling:$('[data-act="add-role"]');btn&&btn.click();return}if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-act][tabindex]")){e.preventDefault();e.target.click()}});
const FMAP={"f-sprint":["tasks","sprint"],"f-quarter":["tasks","quarter"],"f-from":["tasks","from"],"f-to":["tasks","to"],"f-member":["tasks","member"],"f-prio":["tasks","prio"],"f-timing":["tasks","timing"],"f-epic":["tasks","epic"],"w-sprint":["wl","sprint"],"rv-sprint":["rv","sprint"],"rv-quarter":["rv","quarter"],"rv-end":["rv","end"],"rv-role":["rv","role"],"w-quarter":["wl","quarter"],"w-role":["wl","role"],"a-epic":["arch","epic"],"f-q":["tasks","q"],
  "f-role":["tasks","role"],"f-level":["tasks","level"],"a-role":["arch","role"],"a-level":["arch","level"],"tm-role":["team","role"],"tm-level":["team","level"],"tm-q":["team","q"],
  "d-q":["docs","q"],"d-cat":["docs","cat"],"d-kind":["docs","kind"],
  "a-q":["arch","q"],"a-member":["arch","member"],"a-sprint":["arch","sprint"],"a-quarter":["arch","quarter"],"a-prio":["arch","prio"],"a-tag":["arch","tag"],"a-from":["arch","from"],"a-to":["arch","to"],
  "m-from":["mtg","from"],"m-to":["mtg","to"],"m-member":["mtg","member"],"m-q":["mtg","q"]};
let qt;
/* "+" swatch: show the picked color as a new selected swatch while the picker is open. */
document.addEventListener("input",e=>{const name=e.target.dataset&&e.target.dataset.cpick;if(!name)return;const c=normColor(e.target.value);if(!c)return;
  const box=e.target.closest(".swatches");let ex=[...box.querySelectorAll("input[type=radio]")].find(i=>i.value===c&&!i.closest(".pending"));
  const pend=box.querySelector("label.pending");
  if(ex){if(pend)pend.remove();ex.checked=true;return}
  let lab=pend;if(!lab){lab=document.createElement("label");lab.className="pending";lab.innerHTML=`<input type="radio" name="${name}"><span></span>`;box.insertBefore(lab,e.target.closest("label.add"))}
  const r=lab.querySelector("input");r.value=c;r.id=e.target.id.replace(/pick$/,"new");r.checked=true;lab.title=c;lab.querySelector("span").style.background=c;
});
document.addEventListener("input",e=>{const m=FMAP[e.target.id];if(!m)return;S.f[m[0]][m[1]]=e.target.value;
  if(m[1]==="role"){const f=S.f[m[0]];if(f.level!=="all"&&!levelChoices(f.role).includes(f.level))f.level="all"}
  if(e.target.type==="search"){clearTimeout(qt);qt=setTimeout(render,180)}else render()});
document.addEventListener("change",e=>{
  if(e.target.dataset.status)setStatus(e.target.dataset.status,e.target.value);
  else if(e.target.dataset.sstatus)setSubStatus(e.target.dataset.sstatus,e.target.value);
  else if(e.target.dataset.sest){const v=e.target.value;write(db=>db.doc("subtasks/"+e.target.dataset.sest).update({estimate:v===""?null:+v,updatedAt:new Date().toISOString()}),"Estimate saved")}
  else if(e.target.dataset.fshow){const[pk,k,flag]=e.target.dataset.fshow.split("|");const c=profConfig(pk);saveProf(pk,{fields:c.fields.map(f=>f.key===k?{...f,[flag]:e.target.checked}:f)})}
  else if(e.target.dataset.rtoggle){const[pk,rid]=e.target.dataset.rtoggle.split("|");const c=profConfig(pk);saveProf(pk,{rules:c.rules.map(r=>r.id===rid?{...r,enabled:e.target.checked}:r)},e.target.checked?"Rule turned on":"Rule turned off")}
  else if(e.target.dataset.leave){const sp=sprintById(S.wl&&S.wl.sprintId);if(!sp)return;const v=e.target.value;const leave={...(sp.leave||{})};if(v===""||+v===0)delete leave[e.target.dataset.leave];else leave[e.target.dataset.leave]=+v;
    write(db=>db.doc("sprints/"+sp.id).update({leave}),"Leave saved").then(ok=>ok&&runAnalysis())}
  else if(e.target.dataset.mcap){const v=e.target.value;write(db=>db.doc("members/"+e.target.dataset.mcap).update({capacity:v===""?null:+v}),"Capacity saved")}
  else if(e.target.dataset.sassign!==undefined&&e.target.dataset.sassign)write(db=>db.doc("subtasks/"+e.target.dataset.sassign).update({assigneeId:e.target.value||null,updatedAt:new Date().toISOString()}));
  else if(e.target.dataset.sid){const v=e.target.value.trim();const x=S.subtasks.find(y=>y.id===e.target.dataset.sid);if(v&&x&&v!==x.title)write(db=>db.doc("subtasks/"+x.id).update({title:v,updatedAt:new Date().toISOString()}),"Subtask renamed")}
  else if(e.target.dataset.move!==undefined&&e.target.value){const v=e.target.value;write(db=>db.doc("tasks/"+e.target.dataset.move).update({sprintId:v,updatedAt:new Date().toISOString()}),"Moved to "+sprintName(v))}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="rv-params"){e.preventDefault();const v=+new FormData(e.target).get("lateGraceDays");saveProf("rv",{params:{lateGraceDays:Number.isNaN(v)?0:Math.max(0,v)}},"Assumptions saved");return}
  if(e.target.id==="rv-retro"){e.preventDefault();const sp=S.rv&&S.rv.win.sprint&&sprintById(S.rv.win.sprint.id);if(!sp)return;const fd=new FormData(e.target);
    write(db=>db.doc("sprints/"+sp.id).update({retro:{well:String(fd.get("well")||""),improve:String(fd.get("improve")||""),actions:String(fd.get("actions")||""),updatedAt:new Date().toISOString()}}),"Retro notes saved");return}
  if(e.target.id!=="w-params")return;e.preventDefault();const fd=new FormData(e.target);const n=(k,d)=>{const v=fd.get(k);return v===""||v==null||Number.isNaN(+v)?d:+v};
  const levelFactors={};e.target.querySelectorAll("[data-level]").forEach(i=>{if(i.value!=="")levelFactors[i.dataset.level]=+i.value});
  const params={unit:fd.get("unit"),defaultEstimate:n("defaultEstimate",3),baseCapacity:n("baseCapacity",20),refDays:Math.max(1,n("refDays",10)),sprintBuffer:n("sprintBuffer",20),quarterBuffer:n("quarterBuffer",25),
    overloadAt:n("overloadAt",100),targetLoad:n("targetLoad",90),roomBelow:n("roomBelow",70),dueWindow:Math.max(1,n("dueWindow",3)),weekend:fd.getAll("weekend").map(Number),holidays:String(fd.get("holidays")||"").trim(),levelFactors};
  saveAnalysisConfig({params},"Assumptions saved");
});
/* drag & drop */
let dragId=null,dragSub=null;
/* Task cards drop on [data-drop]; subtask cards drop only on cells of their own parent's lane ([data-sdrop][data-task]). */
const dropTarget=e=>{const col=e.target.closest&&e.target.closest("[data-drop],[data-sdrop]");if(!col)return null;
  if(dragId&&col.dataset.drop)return col;
  if(dragSub&&col.dataset.sdrop){const x=S.subtasks.find(y=>y.id===dragSub);if(x&&col.dataset.task===x.taskId)return col}
  return null};
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest(".card");if(!c)return;dragId=c.dataset.id||null;dragSub=c.dataset.subid||null;c.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId||dragSub)}catch(_){}});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"));dragId=null;dragSub=null});
document.addEventListener("dragover",e=>{const col=dropTarget(e);if(!col)return;e.preventDefault();document.querySelectorAll(".over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
document.addEventListener("drop",e=>{const col=dropTarget(e);if(!col)return;e.preventDefault();col.classList.remove("over");if(S.readOnly)return;
  if(dragSub)setSubStatus(dragSub,col.dataset.sdrop);else setStatus(dragId,col.dataset.drop)});

window.addEventListener("hashchange",route);
setInterval(()=>{if(!dlg.open&&!cdlg.open&&S.view!=="docs")render()},5*60*1000);
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(S.view==="docs"||S.view==="help")render()})}catch(e){}
new MutationObserver(()=>{if(S.view==="docs"||S.view==="help")render()}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

/* ---------- boot ---------- */
$("#btnOut").onclick=signOut;
const lm=LS.get("cohort-mode");if(["sprint","quarter","week"].includes(lm))S.f.tasks.mode=lm;
const lg=LS.get("cohort-group");if(["subtasks","epic","none"].includes(lg))S.f.tasks.group=lg;
S.collapsed=new Set(LS.get("cohort-lanes")||[]);
{const saved=LS.get(CFG_KEY);if(saved&&saved.token&&saved.owner&&saved.repo)connect(saved);else route();}
})();
</script>
